<style>
  @keyframes ko-fade-up { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  @keyframes ko-fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes ko-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes ko-pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
  @keyframes ko-drift { 0% { transform: translate3d(0,0,0); } 50% { transform: translate3d(40px,-30px,0); } 100% { transform: translate3d(0,0,0); } }

  .ko-fade-up { animation: ko-fade-up 700ms cubic-bezier(0.22,1,0.36,1) both; }
  .ko-fade-in { animation: ko-fade-in 900ms cubic-bezier(0.22,1,0.36,1) both; }

  /* ---------- Reveal on scroll ---------- */
  [data-reveal] {
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 800ms cubic-bezier(0.22,1,0.36,1), transform 800ms cubic-bezier(0.22,1,0.36,1);
    will-change: opacity, transform;
  }
  [data-reveal].in { opacity: 1; transform: translateY(0); }

  /* Stagger children of any reveal section */
  [data-stagger] > * {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 700ms cubic-bezier(0.22,1,0.36,1), transform 700ms cubic-bezier(0.22,1,0.36,1);
  }
  [data-stagger].in > * { opacity: 1; transform: translateY(0); }
  [data-stagger].in > *:nth-child(1) { transition-delay: 60ms; }
  [data-stagger].in > *:nth-child(2) { transition-delay: 140ms; }
  [data-stagger].in > *:nth-child(3) { transition-delay: 220ms; }
  [data-stagger].in > *:nth-child(4) { transition-delay: 300ms; }
  [data-stagger].in > *:nth-child(5) { transition-delay: 380ms; }
  [data-stagger].in > *:nth-child(6) { transition-delay: 460ms; }

  /* Hero float on the showcase */
  .ko-hero-float { animation: ko-float 6s ease-in-out infinite; }
  .ko-hero-float-slow { animation: ko-float 8s ease-in-out infinite; animation-delay: -2s; }

  /* ---------- Scroll progress bar ---------- */
  #ko-scroll-progress {
    position: fixed; top: 0; left: 0;
    height: 2px; width: 0%;
    background: linear-gradient(90deg, #0E8ED0, #18B7FF, #9EEBFF);
    box-shadow: 0 0 14px rgba(24,183,255,0.55);
    z-index: 100;
    transition: width 120ms linear, opacity 300ms ease;
    pointer-events: none;
  }

  /* ---------- Header scrolled state ---------- */
  body.ko-scrolled [data-ko-header] {
    background: rgba(3,11,20,0.78) !important;
    backdrop-filter: blur(22px) saturate(140%) !important;
    -webkit-backdrop-filter: blur(22px) saturate(140%) !important;
    border-bottom: 1px solid rgba(110,216,255,0.10) !important;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }
  [data-ko-header] { transition: background 320ms ease, backdrop-filter 320ms ease, border-color 320ms ease, box-shadow 320ms ease; }

  /* ---------- Drifting ambient glows (behind everything) ---------- */
  #ko-ambient {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  }
  #ko-ambient::before, #ko-ambient::after {
    content: ''; position: absolute; border-radius: 50%;
    filter: blur(80px); opacity: 0.5; will-change: transform;
  }
  #ko-ambient::before {
    width: 520px; height: 520px;
    left: -120px; top: 30%;
    background: radial-gradient(circle, rgba(24,183,255,0.18), transparent 60%);
    animation: ko-drift 22s ease-in-out infinite;
  }
  #ko-ambient::after {
    width: 640px; height: 640px;
    right: -160px; top: 60%;
    background: radial-gradient(circle, rgba(14,142,208,0.16), transparent 60%);
    animation: ko-drift 28s ease-in-out infinite reverse;
  }
  #root { position: relative; z-index: 1; }

  /* ---------- Hero scroll dissolve ---------- */
  [data-hero] .ko-hero-content,
  [data-hero] [data-hero-showcase] {
    will-change: transform, opacity;
  }

  /* ---------- Section divider that glows when in view ---------- */
  .ko-section-divider {
    position: relative; height: 1px; margin: 0 auto; max-width: 240px;
    background: linear-gradient(90deg, transparent, rgba(110,216,255,0.30), transparent);
    opacity: 0; transition: opacity 700ms ease;
  }
  .ko-section-divider.in { opacity: 1; }

  /* ---------- Reduced motion ---------- */
  @media (prefers-reduced-motion: reduce) {
    [data-reveal], [data-stagger] > *, .ko-hero-float, .ko-hero-float-slow,
    #ko-ambient::before, #ko-ambient::after {
      animation: none !important; transition: none !important;
      opacity: 1 !important; transform: none !important;
    }
  }

  /* ---------- Mobile tuning ---------- */
  @media (max-width: 768px) {
    /* Thinner progress bar */
    #ko-scroll-progress { height: 2px; }
    /* Smaller, lower-cost ambient glows */
    #ko-ambient::before {
      width: 320px; height: 320px;
      left: -100px; top: 20%;
      filter: blur(60px); opacity: 0.45;
      animation-duration: 28s;
    }
    #ko-ambient::after {
      width: 380px; height: 380px;
      right: -120px; top: 65%;
      filter: blur(60px); opacity: 0.4;
      animation-duration: 34s;
    }
    /* Faster reveal so content appears sooner on tall mobile scrolls */
    [data-reveal] { transition-duration: 600ms; transform: translateY(20px); }
    [data-stagger] > * { transition-duration: 520ms; transform: translateY(16px); }
    [data-stagger].in > *:nth-child(1) { transition-delay: 40ms; }
    [data-stagger].in > *:nth-child(2) { transition-delay: 100ms; }
    [data-stagger].in > *:nth-child(3) { transition-delay: 160ms; }
    [data-stagger].in > *:nth-child(4) { transition-delay: 220ms; }
    [data-stagger].in > *:nth-child(5) { transition-delay: 280ms; }
    [data-stagger].in > *:nth-child(6) { transition-delay: 340ms; }
  }

  /* Smooth scroll for in-page jumps */
  html { scroll-behavior: smooth; }

  /* Page wrapper */
  body { background: #030B14; }

  /* Cleaner button hover */
  .ko-btn-primary { letter-spacing: 0.01em; }
</style>

<body>
  <div id="ko-scroll-progress"></div>
  <div id="ko-ambient" aria-hidden="true"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="image-slot.js"></script>
  <script src="locale.js"></script>
  <script type="text/babel" src="Icons.jsx"></script>
  <script type="text/babel" src="Header.jsx"></script>

  <script type="text/babel" src="Solutions.jsx"></script>
  <script type="text/babel" src="Products.jsx"></script>

  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="PageShell.jsx"></script>

  <script type="text/babel">
    /* ============================================================
       Newsletter tile, matching the Resources library card
       ============================================================ */
    const HomeInsightCard = ({ icon, title, copy, meta, cover }) => {
      const [hov, setHov] = React.useState(false);
      const [zoom, setZoom] = React.useState(false);
      React.useEffect(() => {
        if (!zoom) return;
        const onKey = (ev) => { if (ev.key === 'Escape') setZoom(false); };
        document.addEventListener('keydown', onKey);
        const prev = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = prev; };
      }, [zoom]);
      return (
        <div onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
          style={{ position: 'relative', borderRadius: 28, padding: 24,
            border: '1px solid ' + (hov ? 'rgba(110,216,255,0.32)' : 'rgba(110,216,255,0.12)'),
            background: 'rgba(255,255,255,0.045)', backdropFilter: 'blur(20px)',
            boxShadow: hov ? '0 30px 90px rgba(0,0,0,0.45), 0 0 50px rgba(24,183,255,0.08)' : '0 24px 80px rgba(0,0,0,0.35)',
            overflow: 'hidden', transition: 'all 240ms cubic-bezier(0.22,1,0.36,1)',
            transform: hov ? 'translateY(-4px)' : 'none', display: 'flex', flexDirection: 'column' }}>
          <div style={{ position: 'absolute', top: -30, right: -30, width: 220, height: 220, background: 'radial-gradient(circle, rgba(24,183,255,0.16), transparent 60%)', pointerEvents: 'none' }} />
          <div style={{ position: 'relative', marginBottom: 4, display: 'flex', justifyContent: 'center' }}>
            <div style={{ position: 'absolute', inset: '-10% -5%', background: 'radial-gradient(ellipse at 50% 40%, rgba(24,183,255,0.30), rgba(110,216,255,0.12) 50%, transparent 75%)', filter: 'blur(34px)', pointerEvents: 'none', zIndex: 0 }} />
            <img src={cover} alt={`${title} cover`} onClick={() => setZoom(true)} title="Click to view"
              style={{ position: 'relative', zIndex: 1, display: 'block', width: '100%', height: '180px', objectFit: 'cover', objectPosition: 'top center', borderRadius: '14px', cursor: 'zoom-in', border: '1px solid rgba(110,216,255,0.22)', background: 'rgba(6,23,40,0.55)', boxShadow: '0 14px 40px rgba(0,0,0,0.45)' }} />
          </div>
          <div style={{ position: 'relative', display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: 20 }}>
            <div style={{ width: 44, height: 44, borderRadius: 12, background: hov ? '#18B7FF' : 'rgba(24,183,255,0.10)', color: hov ? '#04111F' : '#6ED8FF', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: hov ? '0 0 28px rgba(24,183,255,0.40)' : '0 0 18px rgba(24,183,255,0.10)', transition: 'all 220ms', border: '1px solid rgba(110,216,255,0.18)' }}>
              <Icon name={icon} size={22} />
            </div>
            <Tag>Newsletter</Tag>
          </div>
          <h3 style={{ position: 'relative', marginTop: 16, fontFamily: 'var(--ko-font-display)', fontWeight: 800, fontSize: 18, color: '#fff', lineHeight: 1.25, letterSpacing: '-0.01em' }}>{title}</h3>
          <p style={{ position: 'relative', marginTop: 10, fontSize: 13.5, color: 'rgba(255,255,255,0.62)', lineHeight: 1.55, flex: 1 }}>{copy}</p>
          <div style={{ position: 'relative', marginTop: 14, fontFamily: 'var(--ko-font-mono)', fontSize: 11.5, color: 'rgba(110,216,255,0.65)', letterSpacing: '0.06em' }}>{meta}</div>
          <div style={{ position: 'relative', marginTop: 16, display: 'flex', gap: 10 }}>
            <button onClick={() => setZoom(true)}
              style={{ flex: 1, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8, padding: '11px 14px', borderRadius: 10, cursor: 'pointer', border: 'none', background: 'linear-gradient(135deg, #18B7FF, #6ED8FF)', color: '#04111F', fontFamily: 'var(--ko-font-display)', fontWeight: 800, fontSize: 12.5, transition: 'all 220ms', boxShadow: hov ? '0 8px 24px rgba(24,183,255,0.35)' : 'none' }}>
              <Icon name="search" size={14} /> View
            </button>
          </div>
          {zoom && ReactDOM.createPortal(
            <div onClick={() => setZoom(false)}
              style={{ position: 'fixed', inset: 0, zIndex: 9999, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'rgba(3,11,20,0.90)', backdropFilter: 'blur(16px)', cursor: 'zoom-out', padding: '72px 24px 48px', overflowY: 'auto' }}>
              <button onClick={(e) => { e.stopPropagation(); setZoom(false); }} aria-label="Close preview"
                style={{ position: 'fixed', top: 24, right: 24, width: 48, height: 48, borderRadius: '50%', cursor: 'pointer', zIndex: 2, border: '1px solid rgba(110,216,255,0.30)', background: 'rgba(6,23,40,0.72)', backdropFilter: 'blur(10px)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <Icon name="x" size={22} />
              </button>
              <img src={cover} alt={`${title} preview`} onClick={(e) => e.stopPropagation()}
                style={{ display: 'block', margin: 'auto', maxWidth: '94vw', maxHeight: '90vh', objectFit: 'contain', cursor: 'default', borderRadius: 16, boxShadow: '0 40px 120px rgba(0,0,0,0.6), 0 0 80px rgba(24,183,255,0.18)', border: '1px solid rgba(110,216,255,0.22)' }} />
            </div>, document.body)}
        </div>);
    };

    /* ============================================================
       Reveal-on-scroll hook
       ============================================================ */
    const useReveal = () => {
      React.useEffect(() => {
        const els = document.querySelectorAll('[data-reveal]');
        if (!('IntersectionObserver' in window)) {
          els.forEach(el => el.classList.add('in'));
          return;
        }
        const io = new IntersectionObserver((entries) => {
          entries.forEach(e => {
            if (e.isIntersecting) {
              e.target.classList.add('in');
              io.unobserve(e.target);
            }
          });
        }, { threshold: 0.12, rootMargin: '0px 0px -80px 0px' });
        els.forEach(el => io.observe(el));
        return () => io.disconnect();
      }, []);
    };

    /* ============================================================
       Hero parallax, soft mouse-driven shift on the showcase
       ============================================================ */
    const useParallax = () => {
      React.useEffect(() => {
        const hero = document.querySelector('[data-hero]');
        if (!hero) return;
        let raf = 0;
        const onMove = (e) => {
          const r = hero.getBoundingClientRect();
          const x = (e.clientX - r.left) / r.width - 0.5;
          const y = (e.clientY - r.top) / r.height - 0.5;
          cancelAnimationFrame(raf);
          raf = requestAnimationFrame(() => {
            const showcase = hero.querySelector('[data-hero-showcase]');
            const grid     = hero.querySelector('[data-hero-grid]');
            const spotlight= hero.querySelector('[data-hero-spotlight]');
            if (showcase)  showcase.style.transform  = `translate3d(${x * -16}px, ${y * -10}px, 0)`;
            if (grid)      grid.style.transform      = `translate3d(${x *  10}px, ${y *  6}px, 0)`;
            if (spotlight) spotlight.style.transform = `translate3d(${x *  24}px, ${y * 14}px, 0)`;
          });
        };
        hero.addEventListener('mousemove', onMove);
        return () => hero.removeEventListener('mousemove', onMove);
      }, []);
    };

    /* ============================================================
       Scroll-driven effects: progress bar, header tint, hero dissolve
       ============================================================ */
    const useScrollEffects = () => {
      React.useEffect(() => {
        const bar = document.getElementById('ko-scroll-progress');
        const hero = document.querySelector('[data-hero]');
        const heroContent  = hero && hero.querySelector('.ko-hero-content');
        const heroShowcase = hero && hero.querySelector('[data-hero-showcase]');
        const ambient = document.getElementById('ko-ambient');
        const isMobile = () => window.matchMedia('(max-width: 768px)').matches;
        let raf = 0;
        const onScroll = () => {
          cancelAnimationFrame(raf);
          raf = requestAnimationFrame(() => {
            const y   = window.scrollY;
            const doc = document.documentElement;
            const max = Math.max(1, doc.scrollHeight - window.innerHeight);
            const p   = Math.min(1, y / max);
            if (bar) bar.style.width = (p * 100).toFixed(2) + '%';
            document.body.classList.toggle('ko-scrolled', y > 20);
            const mobile = isMobile();
            // Hero dissolve while still visible (gentler on mobile)
            if (hero) {
              const vh = window.innerHeight;
              const t  = Math.min(1, Math.max(0, y / (vh * (mobile ? 0.55 : 0.7))));
              const opMul = mobile ? 0.7 : 0.9;
              const trMul = mobile ? -24 : -40;
              if (heroContent)  { heroContent.style.opacity  = String(1 - t * opMul); heroContent.style.transform  = `translate3d(0, ${t * trMul}px, 0)`; }
              if (heroShowcase) { heroShowcase.style.opacity = String(1 - t * 0.7); heroShowcase.style.transform = `translate3d(0, ${t * (mobile ? 36 : 60)}px, 0) scale(${1 - t * 0.04})`; }
            }
            // Ambient glow drifts with scroll (smaller mult on mobile)
            if (ambient) ambient.style.transform = `translate3d(0, ${y * (mobile ? -0.02 : -0.04)}px, 0)`;
          });
        };
        onScroll();
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);
    };

    const App = () => {
      useReveal();
      useParallax();
      useScrollEffects();
      return (
        <div>
          {/* Hero with absolutely-positioned header overlay */}
          <div style={{position:'relative'}}>
            <HeaderStack active="Home"/>
            <Hero/>
          </div>
          <div data-reveal data-stagger>
            <SolutionsSection/>
          </div>
          <div data-reveal data-stagger>
            <ProductsSection/>
          </div>
          <div data-reveal data-stagger>
            <WhyKlimaOptima/>
          </div>
          <div data-reveal data-stagger>
            <SectionBand shade={2}>
              <SectionHead align="center" eyebrow="Featured Insights" title="Climate, humidity, and air quality, " titleHighlight="explained." sub="Field-tested guidance from the deployment teams."/>
              <div style={{marginTop: 56, display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap: 18}}>
                <HomeInsightCard icon="droplet" title="The Dangers of High Humidity"
                  cover="assets/newsletters/dangers-of-high-humidity.png"
                  copy="Your business is at risk. How a high-humidity climate quietly triggers mold, corrosion, spoilage, and equipment damage, what relative humidity means, the business risk by RH level, and how to manage it."
                  meta="Vol.1 No.1 · Read · 5 min"/>
                <HomeInsightCard icon="sun" title="Heat Stress at the Workplace"
                  cover="assets/newsletters/heat-stress-at-the-workplace.png"
                  copy="Hotter conditions, higher risks. How a rising heat index threatens worker health, safety, and productivity, and the practical ways to keep teams cooler, safer, and on the job."
                  meta="Vol.1 No.2 · Read · 5 min"/>
                <HomeInsightCard icon="snowflake" title="Portable Aircons vs Evaporative Coolers"
                  cover="assets/newsletters/portable-aircons-vs-evaporative-coolers.png"
                  copy="Feel the difference. Why evaporative coolers add moisture and make enclosed spaces feel warmer, while portable air conditioners remove heat and deliver real cold air."
                  meta="Vol.1 No.3 · Read · 4 min"/>
                <HomeInsightCard icon="shield" title="Humidity Hazards Affecting Hospitals"
                  cover="assets/newsletters/humidity-hazards-affecting-hospitals.png"
                  copy="High humidity creates hidden risks in healthcare. Infection control, virus transmission, and damage to sensitive medical equipment."
                  meta="Vol.1 No.4 · Read · 5 min"/>
              </div>
              <div style={{marginTop: 40, display:'flex', justifyContent:'center'}}>
