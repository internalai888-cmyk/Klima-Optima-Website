  <script type="text/babel">
const SECTIONS = [
  ['1. Privacy Statement', [
    'Klima Optima Philippines (Gridpoint Technologies Inc.), collects, processes and stores personal data about you when you inquire about our products and services via our website, social media pages and though our other online platforms, provided that you have given your express consent.',
    'This privacy policy has been prepared to better serve any person who inquires or avails of the Services of Klima Optima Philippines (Gridpoint Technologies Inc.) to inform him/her of how their personal data is collected, used and secured.',
    'Please read our privacy policy carefully to get a clear understanding of how Klima Optima Philippines (Gridpoint Technologies Inc.) collects, uses, protects or otherwise handles your personal data in accordance with Republic Act No. 10173, or the Data Privacy Act of 2012, and its Implementing Rules and Regulations (collectively, the \u201cData Privacy Act\u201d).'
  ]],
  ['2. Collection of Personal Data', [
    'Klima Optima Philippines (Gridpoint Technologies Inc.) collects information you provide directly to it, such as when you attend or participate in any of its events, respond to a survey, send inquiries through our websites, social media pages and other online platforms, sign up for our mailing list or contact customer support or otherwise communicate or interact with Klima Optima Philippines (Gridpoint Technologies Inc.). (the \u201cEvent\u201d).'
  ]],
  ['3. Use and Processing of Personal Data', [
    'Klima Optima Philippines (Gridpoint Technologies Inc.) may use and process the personal data collected about you to allow you to avail of the Services and/or to participate in the Event, other similar events to be provided by or held by Klima Optima Philippines (Gridpoint Technologies Inc.), marketing activities and commercial communications, including direct marketing. At all times, your personal data shall not be used or processed for any purpose that is contrary to law, morals, or public policy.'
  ]],
  ['4. Sharing of Personal Data', [
    'Klima Optima Philippines (Gridpoint Technologies Inc.) may share personal data between and among the entities to enable them to provide you personalized Services. Klima Optima Philippines (Gridpoint Technologies Inc.) may also share personal data with vendors, consultants, and other service providers who need access to such information to carry out work on behalf of Klima Optima Philippines (Gridpoint Technologies Inc.). If and when necessary, a data sharing agreement shall cover any sharing of data between and among Klima Optima Philippines (Gridpoint Technologies Inc.) and/or its vendors, consultants, marketing partners, and other service providers. Klima Optima Philippines (Gridpoint Technologies Inc.) may also share information in accordance with any order from any relevant government agency as provided by law.'
  ]],
  ['5. Storage and Protection of Personal Data', [
    'Klima Optima Philippines (Gridpoint Technologies Inc.) has instituted policies and procedures which intend to protect personal data which it has collected and continues to collect. These include securing any document containing personal data, requiring the execution of non-disclosure agreements by its employees, consultants, vendors, suppliers and contractors, among others.',
    'Klima Optima Philippines (Gridpoint Technologies Inc.) websites are scanned on a regular basis for security holes and known vulnerabilities in order to make your visit to said website as safe as possible. Your personal data is contained behind secured networks and is only accessible by a limited number of persons who have special access rights to such systems, and are required to keep the personal data confidential.',
    'While there will always be a risk of unauthorized disclosure of personal data, Klima Optima Philippines (Gridpoint Technologies Inc.) believes that the foregoing safeguards are sufficient to prevent the occurrence of such unauthorized disclosure and is committed to updating and improving such safeguards in order to protect your personal data in compliance with the Data Privacy Act.'
  ]],
  ['6. Use of Cookies', [
    'Please note that in visiting Klima Optima Philippines (Gridpoint Technologies Inc.) websites, cookies are utilized. Cookies are small files that a site or its service provider transfers to your computer\u2019s hard drive through your Web browser (if you allow) that enables the site\u2019s or service provider\u2019s systems to recognize your browser and capture and remember certain information. Klima Optima Philippines (Gridpoint Technologies Inc.) also uses cookies to help it compile aggregate data about site traffic and site interaction so that Klima Optima Philippines (Gridpoint Technologies Inc.) can offer better site experiences and tools in the future.',
    'You can choose to have your computer warn you each time a cookie is being sent, or you can choose to turn off all cookies. You do this through your browser settings. Since browser is a little different, look at your browser\u2019s Help Menu to learn the correct way to modify your cookies. If you turn cookies off, some features will be disabled. Some of the features that make your site experience more efficient and may not function properly.'
  ]],
  ['7. User Responsibility', [
    'While we employ all necessary precautions to safeguard your information, we cannot warrant 100% cyber security. Klima Optima Philippines (Gridpoint Technologies Inc.) encourages you to use the latest version of web browsers. Updated web browsers are normally equipped with security features that provide anti-phishing protection, improved parental controls and tools to prevent malware and other privacy threats.',
    'Our website may also contain hyperlinks to third-party websites that are not owned or controlled by Klima Optima Philippines (Gridpoint Technologies Inc.). The links to third-party websites are provided for your convenience and information only. Klima Optima Philippines (Gridpoint Technologies Inc.) advises you to read and study the privacy policy of third-party websites to determine how they handle and protect information they collect from you.'
  ]]
];

const RIGHTS = [
  ['A.', 'You have the right to be informed of the collection and processing of your personal data, the purpose for which they will be processed, among others. Thus, you are required to read this privacy policy before giving your consent to the collection and processing of your personal data. If you have questions, please do not hesitate to ask us questions or clarifications and you may also contact our Data Protection Officer;'],
  ['B.', 'You have the right to object to the processing of your personal data. You will be given an option or opportunity to withhold your consent to the processing of your personal data whenever the Klima Optima Philippines (Gridpoint Technologies Inc.) communicates with you or by notifying our Data Protection Officer;'],
  ['C.', 'You have the right to have reasonable access to your personal data by notifying our Data Protection Officer;'],
  ['D.', 'You have the right to rectify or correct any inaccuracy or error in your personal data by submitting your request for rectification or correction to our Data Protection Officer;'],
  ['E.', 'You have the right to suspend, withdraw or order the blocking, removal or destruction of your personal data in accordance with the requirements of the Data Privacy Act. Please notify our Data Protection Officer if you wish to exercise this right;'],
  ['F.', 'You have the right to obtain a copy of your data in an electronic or structured format if the same is processed by electronic means and in a structured and commonly used format by submitting your request to our Data Protection Officer; and']
];

const TAIL = [
  ['9. Changes to the Privacy Policy', [
    'Klima Optima Philippines (Gridpoint Technologies Inc.) may change this Privacy Policy from time to time. If Klima Optima Philippines (Gridpoint Technologies Inc.) makes any significant change in the collection, use, and protection of personal data, Klima Optima Philippines (Gridpoint Technologies Inc.) will provide you notice through the Services or by some other means, such as email. It is encouraged that you periodically review the Privacy Policy in the Klima Optima Philippines (Gridpoint Technologies Inc.) website.'
  ]]
];

const DPO = [
  ['Title/Designation', 'Data Protection Officer', null],
  ['Postal Address', '2904B West Tower Philippine Stock Exchange Center, Exchange Road, Ortigas Center Pasig City, Philippines 1605', null],
  ['Telephone Number', '(02) 7955-8588', 'tel:+6327955858'],
  ['Email Address', 'dpo@klimaoptima.com', 'mailto:dpo@klimaoptima.com']
];

const CONSENT = [
  'We will secure your consent prior to the collection and processing of your personal data, or as soon as practicable and reasonable in order to ensure continuation of the Services. Before you give your consent, you will be provided with an opportunity to read and review this Privacy Policy. If you are below eighteen (18) years old, Klima Optima Philippines (Gridpoint Technologies Inc.) requires you to secure consent from your parents or legal guardians in order to use any of the Services. Klima Optima Philippines (Gridpoint Technologies Inc.) does not specifically market to persons under eighteen (18) years old.',
  'If you consent to the collection and processing of your personal data in accordance with the Privacy Policy, such consent shall be valid for the purpose for which they are collected or ten (10) years, whichever is shorter, or as may be required by applicable law or when necessary as provided by the Data Privacy Act, or unless you have expressly withdrawn such consent.'
];

const bodyText = { margin: 0, color: 'rgba(255,255,255,0.76)', fontSize: 16, lineHeight: 1.7, textWrap: 'pretty' };
const headStyle = { margin: 0, fontFamily: 'var(--ko-font-display)', fontWeight: 900, fontSize: 24, color: '#fff', letterSpacing: '-0.015em', lineHeight: 1.25 };
const labelStyle = { fontFamily: 'var(--ko-font-display)', fontWeight: 900, fontSize: 11, letterSpacing: '0.18em', textTransform: 'uppercase', color: 'rgba(110,216,255,0.65)', paddingTop: 4 };

const Block = ({ title, children }) =>
  <GlassCard padding={36}>
    <h2 style={headStyle}>{title}</h2>
    <div style={{ marginTop: 18, display: 'grid', gap: 14 }}>{children}</div>
  </GlassCard>;

const App = () =>
  <Page active="">
    <PageHero
      crumbs={[{ label: 'Home', href: 'Klima Optima Homepage.html' }, { label: 'Privacy Policy' }]}
      eyebrow="Legal"
      headline="Privacy"
      headlineHighlight="Policy."
      sub="How Klima Optima Philippines (Gridpoint Technologies Inc.) collects, processes, and protects your personal data under the Data Privacy Act of 2012." />

    <SectionBand shade={1}>
      <Reveal>
        <div style={{ display: 'grid', gap: 18, maxWidth: 940, margin: '0 auto' }}>
          {SECTIONS.map(([title, paras]) =>
            <Block key={title} title={title}>
              {paras.map((p, n) => <p key={n} style={bodyText}>{p}</p>)}
            </Block>
          )}

          <Block title="8. Your Rights under the Data Privacy Act">
            <p style={bodyText}>As a data subject, you have the following rights under the Data Privacy Act:</p>
            <div style={{ display: 'grid', gap: 16, marginTop: 4 }}>
              {RIGHTS.map(([letter, text]) =>
                <div key={letter} style={{ display: 'grid', gridTemplateColumns: '32px minmax(0,1fr)', gap: 12, alignItems: 'start' }}>
                  <span style={{ fontFamily: 'var(--ko-font-display)', fontWeight: 900, fontSize: 15, color: '#6ED8FF' }}>{letter}</span>
                  <p style={bodyText}>{text}</p>
                </div>
              )}
            </div>
          </Block>

          {TAIL.map(([title, paras]) =>
            <Block key={title} title={title}>
              {paras.map((p, n) => <p key={n} style={bodyText}>{p}</p>)}
            </Block>
          )}

          <Block title="10. Contacting Us">
            <p style={bodyText}>If there are any questions regarding this privacy policy, you may contact our Data Protection Officer with the following contact details:</p>
            <div style={{ display: 'grid', gap: 14, marginTop: 8 }}>
              {DPO.map(([label, value, href]) =>
                <div key={label} style={{ display: 'grid', gridTemplateColumns: '170px minmax(0,1fr)', gap: 16, alignItems: 'start' }}>
                  <span style={labelStyle}>{label}</span>
                  {href ?
                    <a href={href} style={{ color: '#6ED8FF', textDecoration: 'none', fontSize: 16, lineHeight: 1.6 }}>{value}</a> :
                    <span style={{ color: 'rgba(255,255,255,0.76)', fontSize: 16, lineHeight: 1.6 }}>{value}</span>}
                </div>
              )}
            </div>
          </Block>

          <Block title="11. Consent">
            {CONSENT.map((p, n) => <p key={n} style={bodyText}>{p}</p>)}
          </Block>
        </div>
      </Reveal>
    </SectionBand>

    <CTABand eyebrow="Questions about your data?" title="Talk to Us" sub="Our Data Protection Officer handles access, correction, and withdrawal requests, and any question about this policy." primary={{ label: 'Contact Us', href: 'contact.html' }} secondary={{ label: 'Back to Home', href: 'Klima Optima Homepage.html' }} />
  </Page>;

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
