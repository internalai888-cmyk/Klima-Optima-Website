const ResourceCard = ({ tag, type, title, copy, icon, view, cover, pdf }) => {
  const [hov, setHov] = React.useState(false);
  const [zoom, setZoom] = React.useState(null);
  const slotId = `res-thumb-${title.replace(/[^a-z0-9]/gi, '-').toLowerCase()}`;

  // View action: PDFs open in a new tab; image covers open the in-page zoom preview.
  const openDoc = (e) => {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (pdf && /\.pdf$/i.test(pdf)) { window.open(pdf, '_blank', 'noopener'); return; }
    if (cover) { setZoom(cover); return; }
    if (pdf) { window.open(pdf, '_blank', 'noopener'); return; }
    const el = document.getElementById(slotId);
    let src = null;
    if (el) {
      const root = el.shadowRoot || el;
      const img = root.querySelector('img[src^="data:"], img.ghost, img');
      if (img && img.src && /^data:|^https?:|^blob:/.test(img.src)) src = img.src;
    }
    setZoom(src || '__empty__');
  };

  React.useEffect(() => {
    if (!zoom) return;
    const onKey = (ev) => {if (ev.key === 'Escape') setZoom(null);};
    document.addEventListener('keydown', onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => {document.removeEventListener('keydown', onKey);document.body.style.overflow = prev;};
  }, [zoom]);

  return (
    <div
      onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      style={{
        position: 'relative', borderRadius: 28, padding: 24,
        border: '1px solid ' + (hov ? 'rgba(110,216,255,0.32)' : 'rgba(110,216,255,0.12)'),
        background: 'rgba(255,255,255,0.045)', backdropFilter: 'blur(20px)',
        boxShadow: hov ? '0 30px 90px rgba(0,0,0,0.45), 0 0 50px rgba(24,183,255,0.08)' : '0 24px 80px rgba(0,0,0,0.35)',
        overflow: 'hidden', transition: 'all 240ms cubic-bezier(0.22,1,0.36,1)',
        transform: hov ? 'translateY(-4px)' : 'none',
        display: 'flex', flexDirection: 'column'
      }}>
          <div style={{ position: 'absolute', top: -30, right: -30, width: 220, height: 220, background: 'radial-gradient(circle, rgba(24,183,255,0.16), transparent 60%)', pointerEvents: 'none' }} />

          {/* Cover image / drag-drop slot */}

            <div style={{ position: 'absolute', inset: '-10% -5%', background: 'radial-gradient(ellipse at 50% 40%, rgba(24,183,255,0.30), rgba(110,216,255,0.12) 50%, transparent 75%)', filter: 'blur(34px)', pointerEvents: 'none', zIndex: 0 }} />
            {cover ?
          <img src={cover} alt={`${title} cover`} onClick={openDoc} title="Click to view"
            style={{
              position: 'relative', zIndex: 1, display: 'block',
              width: '100%', height: '180px', objectFit: 'cover', objectPosition: 'top center',
              borderRadius: '14px', cursor: 'zoom-in',
              border: '1px solid rgba(110,216,255,0.22)',
              background: 'rgba(6,23,40,0.55)',
              boxShadow: '0 14px 40px rgba(0,0,0,0.45)'
            }} /> :
          <image-slot
            id={slotId}
            placeholder="Cover"
            shape="rounded" radius="14"
            fit="contain"
            style={{
              position: 'relative', zIndex: 1, display: 'block',
              width: '100%', height: '180px',
              borderRadius: '14px',
              border: '1px solid rgba(110,216,255,0.22)',
              background: 'rgba(6,23,40,0.55)',
              boxShadow: '0 14px 40px rgba(0,0,0,0.45)'
            }} />
          }
          </div>

          <div style={{ position: 'relative', display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: 20 }}>
            <div style={{ width: 44, height: 44, borderRadius: 12, background: hov ? '#18B7FF' : 'rgba(24,183,255,0.10)', color: hov ? '#04111F' : '#6ED8FF', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: hov ? '0 0 28px rgba(24,183,255,0.40)' : '0 0 18px rgba(24,183,255,0.10)', transition: 'all 220ms', border: '1px solid rgba(110,216,255,0.18)' }}>
              <Icon name={icon} size={22} />
            </div>
            <Tag>{tag}</Tag>
          </div>
          <h3 data-rkey={`${slotId}|title`} style={{ position: 'relative', marginTop: 16, fontFamily: 'var(--ko-font-display)', fontWeight: 800, fontSize: 18, color: '#fff', lineHeight: 1.25, letterSpacing: '-0.01em' }}>{title}</h3>
          <p data-rkey={`${slotId}|copy`} style={{ position: 'relative', marginTop: 10, fontSize: 13.5, color: 'rgba(255,255,255,0.62)', lineHeight: 1.55, flex: 1 }}>{copy}</p>
          <div data-rkey={`${slotId}|type`} style={{ position: 'relative', marginTop: 14, fontFamily: 'var(--ko-font-mono)', fontSize: 11.5, color: 'rgba(110,216,255,0.65)', letterSpacing: '0.06em' }}>{type}</div>
          <div style={{ position: 'relative', marginTop: 16, display: 'flex', gap: 10 }}>
            <button onClick={openDoc}
        style={{ flex: 1, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8, padding: '11px 14px', borderRadius: 10, cursor: 'pointer', border: 'none',
          background: 'linear-gradient(135deg, #18B7FF, #6ED8FF)', color: '#04111F',
          fontFamily: 'var(--ko-font-display)', fontWeight: 800, fontSize: 12.5, transition: 'all 220ms',
          boxShadow: hov ? '0 8px 24px rgba(24,183,255,0.35)' : 'none' }}>
              <Icon name="search" size={14} /> View
            </button>
            {pdf &&
          <a href={pdf} download
        style={{ flex: 1, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 6, padding: '11px 14px', borderRadius: 10, textDecoration: 'none', cursor: 'pointer',
          border: '1px solid rgba(110,216,255,0.30)', background: 'rgba(24,183,255,0.08)', color: '#fff',
          fontFamily: 'var(--ko-font-display)', fontWeight: 800, fontSize: 12.5, transition: 'all 220ms' }}>
              <Icon name="download" size={13} /> Download
            </a>
          }
          </div>

          {/* Full-screen preview modal */}
          {zoom && ReactDOM.createPortal(
        <div onClick={() => setZoom(null)}
        style={{ position: 'fixed', inset: 0, zIndex: 9999, display: 'flex', alignItems: 'center', justifyContent: 'center',
          background: 'rgba(3,11,20,0.90)', backdropFilter: 'blur(16px)', WebkitBackdropFilter: 'blur(16px)',
          cursor: 'zoom-out', padding: '72px 24px 48px', overflowY: 'auto', animation: 'koZoomFade 220ms ease-out' }}>
              <button onClick={(e) => {e.stopPropagation();setZoom(null);}} aria-label="Close preview"
          style={{ position: 'fixed', top: 24, right: 24, width: 48, height: 48, borderRadius: '50%', cursor: 'pointer', zIndex: 2,
            border: '1px solid rgba(110,216,255,0.30)', background: 'rgba(6,23,40,0.72)', backdropFilter: 'blur(10px)',
            color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'all 200ms' }}
          onMouseEnter={(e) => {e.currentTarget.style.background = 'rgba(24,183,255,0.22)';e.currentTarget.style.borderColor = 'rgba(110,216,255,0.6)';e.currentTarget.style.boxShadow = '0 0 28px rgba(24,183,255,0.5)';}}
          onMouseLeave={(e) => {e.currentTarget.style.background = 'rgba(6,23,40,0.72)';e.currentTarget.style.borderColor = 'rgba(110,216,255,0.30)';e.currentTarget.style.boxShadow = 'none';}}>
                <Icon name="x" size={22} />
              </button>
              {zoom === '__empty__' ?
          <div style={{ margin: 'auto', textAlign: 'center', maxWidth: 420 }}>
                  <div style={{ width: 72, height: 72, margin: '0 auto', borderRadius: 18, background: 'rgba(24,183,255,0.12)', color: '#6ED8FF', display: 'flex', alignItems: 'center', justifyContent: 'center', border: '1px solid rgba(110,216,255,0.22)' }}>
                    <Icon name="search" size={32} />
                  </div>
                  <h4 style={{ marginTop: 22, fontFamily: 'var(--ko-font-display)', fontWeight: 800, fontSize: 20, color: '#fff' }}>{title}</h4>
                  <p style={{ marginTop: 10, fontSize: 14, color: 'rgba(255,255,255,0.6)', lineHeight: 1.55 }}>No cover uploaded yet. Drop an image into this card's cover slot to enable the full-screen preview.</p>
                </div> :

          <img src={zoom} alt={`${title} preview`} onClick={(e) => e.stopPropagation()}
          style={{ display: 'block', margin: 'auto', width: 'auto', height: 'auto', maxWidth: '94vw', maxHeight: '90vh', objectFit: 'contain', cursor: 'default', imageRendering: 'auto',
            borderRadius: 16, boxShadow: '0 40px 120px rgba(0,0,0,0.6), 0 0 80px rgba(24,183,255,0.18)', border: '1px solid rgba(110,216,255,0.22)' }} />
          }
            </div>,
        document.body)}
        </div>);

};

const ResourcesApp = () => {
  const [active, setActive] = React.useState('All');
  const [specCat, setSpecCat] = React.useState('All');
  const [query, setQuery] = React.useState('');
  const FILTER_MAP = { 'Brochures': 'Brochure', 'Spec Sheets': 'Spec Sheet' };
  const SUB_CATS = active === 'Brochures' ? BROCHURE_CATS : SPEC_CATS;
  const VISIBLE = [...RESOURCES, ...CASE_STUDIES].filter((r) => !HIDDEN_TAGS.includes(r.tag));
  let filtered = active === 'All' ? VISIBLE : VISIBLE.filter((r) => r.tag === FILTER_MAP[active]);
  if (SUBCAT_TABS.includes(active) && specCat !== 'All') filtered = filtered.filter((r) => r.cat === specCat);
  const q = query.trim().toLowerCase();
  if (q) filtered = filtered.filter((r) => (r.title + ' ' + r.copy + ' ' + (r.cat || '') + ' ' + r.tag).toLowerCase().includes(q));

  return (
    <Page active="">
          <PageHero
        crumbs={[{ label: 'Document Library' }]}
        eyebrow="Shared Document Library"
        headline="Brochures and"
        headlineHighlight="Spec Sheets."
        sub="Product brochures and unit-level specifications for facility managers, project leads, and engineers. This page is unlisted and shared by direct link."

              <a href="contact.html" className="ko-btn ko-btn-secondary" style={{ textDecoration: 'none' }}>Request Technical Advisory</a>
            </>} />
      

          {/* Filter + library grid */}

              <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', marginBottom: 36, gap: 32, flexWrap: 'wrap' }}>

              </div>
              <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 24 }}>
                {RESOURCE_FILTERS.map((f) =>
            <button key={f} onClick={() => {setActive(f);setSpecCat('All');}} style={{
              padding: '10px 20px', borderRadius: 9999, cursor: 'pointer',
              fontFamily: 'var(--ko-font-display)', fontWeight: 700, fontSize: 13, letterSpacing: '0.02em',
              border: '1px solid ' + (active === f ? 'rgba(110,216,255,0.45)' : 'rgba(110,216,255,0.14)'),
              background: active === f ? 'rgba(24,183,255,0.16)' : 'rgba(255,255,255,0.04)',
              color: active === f ? '#9EEBFF' : 'rgba(255,255,255,0.78)',
              boxShadow: active === f ? '0 0 24px rgba(24,183,255,0.20)' : 'none',
              transition: 'all 220ms'
            }}>{f}</button>
            )}
              </div>
              <div style={{ position: 'relative', marginBottom: 36, maxWidth: 460 }}>
                <span style={{ position: 'absolute', left: 16, top: '50%', transform: 'translateY(-50%)', color: 'rgba(110,216,255,0.6)', display: 'flex', pointerEvents: 'none' }}>
                  <Icon name="search" size={18} />
                </span>
                <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search resources, products, or solutions..."
            style={{ width: '100%', padding: '13px 16px 13px 46px', borderRadius: 12,
              border: '1px solid rgba(110,216,255,0.18)', background: 'rgba(255,255,255,0.04)',
              color: '#fff', fontFamily: 'var(--ko-font-body)', fontSize: 14, outline: 'none', transition: 'all 220ms' }}
            onFocus={(e) => {e.target.style.borderColor = 'rgba(110,216,255,0.5)';e.target.style.boxShadow = '0 0 24px rgba(24,183,255,0.18)';}}
            onBlur={(e) => {e.target.style.borderColor = 'rgba(110,216,255,0.18)';e.target.style.boxShadow = 'none';}} />
              </div>
              {SUBCAT_TABS.includes(active) &&
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 40, marginTop: -8 }}>
                  {SUB_CATS.map((sc) =>
            <button key={sc} onClick={() => setSpecCat(sc)} style={{
              padding: '8px 18px', borderRadius: 9999, cursor: 'pointer',
              fontFamily: 'var(--ko-font-display)', fontWeight: 700, fontSize: 12, letterSpacing: '0.04em', textTransform: 'uppercase',
              border: '1px solid ' + (specCat === sc ? 'rgba(110,216,255,0.40)' : 'rgba(110,216,255,0.10)'),
              background: specCat === sc ? 'rgba(24,183,255,0.12)' : 'transparent',
              color: specCat === sc ? '#9EEBFF' : 'rgba(255,255,255,0.6)',
              transition: 'all 220ms'
            }}>{sc}</button>
            )}
                </div>
          }
              {(active === 'Brochures' || active === 'Spec Sheets') && specCat === 'All' ?
          SUB_CATS.filter((c) => c !== 'All').map((cat) => {
            const items = filtered.filter((r) => r.cat === cat);
            if (!items.length) return null;
            return (
              <div key={cat} style={{ marginBottom: 48 }}>
                      <h3 style={{ fontFamily: 'var(--ko-font-display)', fontWeight: 800, fontSize: 22, color: '#fff', letterSpacing: '-0.01em', marginBottom: 8 }}>{cat}</h3>
                      <div style={{ height: 2, width: 48, background: 'linear-gradient(90deg, #18B7FF, transparent)', borderRadius: 2, marginBottom: 24 }} />
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 18 }}>
                        {items.map((r) => <ResourceCard key={r.title} {...r} />)}
                      </div>
                    </div>);

          }) :

          filtered.length ?
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 18 }}>
                  {filtered.map((r) => <ResourceCard key={r.title} {...r} />)}
                </div> :
          <div style={{ padding: '56px 40px', borderRadius: 30, border: '1px solid rgba(110,216,255,0.12)', background: 'rgba(255,255,255,0.03)', backdropFilter: 'blur(20px)', textAlign: 'center' }}>
                  <p style={{ margin: 0, fontFamily: 'var(--ko-font-display)', fontWeight: 800, fontSize: 20, color: '#fff', letterSpacing: '-0.01em' }}>Case studies are being prepared.</p>
                  <p style={{ margin: '12px auto 0', maxWidth: 520, fontSize: 15, color: 'rgba(255,255,255,0.58)', lineHeight: 1.6 }}>Project references are available on request while this section is compiled. Contact our technical team for documentation on comparable installations.</p>
                  <a href="contact.html" className="ko-btn ko-btn-secondary" style={{ textDecoration: 'none', fontSize: 13, marginTop: 26, display: 'inline-flex' }}>Request Project References</a>
                </div>
          }
            </Reveal>
          </SectionBand>

          <CTABand
        eyebrow="Need something specific?"
        title="Can't find what you're looking for?"
        sub="Our technical team can provide custom sizing reports, case-study references, and integration documentation on request."
        primary={{ label: 'Contact Technical Team', href: 'contact.html' }}
        secondary={{ label: 'Resources', href: 'resources.html' }} />
      
        </Page>);

};
ReactDOM.createRoot(document.getElementById('root')).render(<ResourcesApp />);
</script>


<script src="security.js"></script>
</body>
</html>
