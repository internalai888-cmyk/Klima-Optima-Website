[build]
  publish = "."

# Netlify ignores .htaccess — these mirror the Apache security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net https://www.googletagmanager.com https://www.google-analytics.com https://www.google.com https://www.gstatic.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; frame-src https://www.google.com https://www.youtube.com; connect-src 'self' https://unpkg.com https://cdn.jsdelivr.net https://www.google-analytics.com https://formsubmit.co; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self' https://formsubmit.co"

# Pages carrying personal data must never be cached
[[headers]]
  for = "/contact.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, private, max-age=0"

[[headers]]
  for = "/careers.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, private, max-age=0"

# Source docs and working folders are not public
[[redirects]]
  from = "/*.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/export/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/klima-optima-document-library-8f3ad2.html"
  to = "/klima-optima-document-library-8f3ad2.html"
  status = 200
