    const BENEFITS = [["shield","Sterile, Hygienic Output","Boiling-point steam is bacteria-free and mineral-free, eliminating contamination risk in hospitals, cleanrooms, and pharmaceutical environments."],["droplet","Prevent Mineral Dusting","Electrode boiling leaves minerals in the cylinder, so no white dust settles on equipment, products, or sensitive surfaces."],["gauge","Precise Proportional Control","Intelligent microprocessor control maintains exact humidity setpoints, preventing process instability in critical operations."],["gear","Easy Modular Servicing","Modular construction and replaceable cylinders minimize downtime and simplify maintenance."],["shield","High Safety Standards","Built-in water sensors, drainage, and protection systems prevent overflow, overheating, and operational failures."],["factory","Flexible Installation","Compact footprint with optional steam blower and duct mounting adapts to diverse facility layouts."]];
