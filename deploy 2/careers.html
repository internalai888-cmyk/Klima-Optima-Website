<script type="application/ld+json" data-ko-breadcrumb-ld>{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://klimaoptima.com/"},{"@type":"ListItem","position":2,"name":"Careers","item":"https://klimaoptima.com/careers.html"}]}</script>

<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="image-slot.js"></script>

  <script type="text/babel" src="Icons.jsx"></script>
  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="PageShell.jsx"></script>

  <script type="text/babel">

    const Field = ({ label, placeholder, select, textarea, options, optional, name, required }) => {
      const [focus, setFocus] = React.useState(false);
      const wrap = {
        borderRadius: 14, border: '1px solid ' + (focus ? 'rgba(110,216,255,0.42)' : 'rgba(110,216,255,0.12)'),
        background: 'rgba(255,255,255,0.04)', padding: '12px 16px',
        transition: 'all 220ms',
        boxShadow: focus ? '0 0 24px rgba(24,183,255,0.18)' : 'none'
      };
      const labelStyle = { display: 'flex', alignItems:'baseline', gap: 8, fontFamily: 'var(--ko-font-display)', fontSize: 10.5, fontWeight: 900, letterSpacing: '0.18em', textTransform: 'uppercase', color: focus ? '#6ED8FF' : 'rgba(110,216,255,0.55)', transition: 'color 220ms' };
      const inputStyle = { width: '100%', background: 'transparent', border: 'none', outline: 'none', color: '#fff', fontFamily: 'var(--ko-font-body)', fontSize: 14.5, padding: '4px 0 0' };
      return (
        <label style={wrap}>
          <span style={labelStyle}>{label}{optional && <span style={{fontWeight:500, letterSpacing:'0.04em', textTransform:'none', fontSize:11, color:'rgba(255,255,255,0.38)'}}>Optional</span>}</span>
          {textarea ?
            <textarea name={name} rows={4} placeholder={placeholder} onFocus={() => setFocus(true)} onBlur={() => setFocus(false)} style={{ ...inputStyle, resize: 'vertical' }} /> :
            select ?
            <select name={name} onFocus={() => setFocus(true)} onBlur={() => setFocus(false)} style={{ ...inputStyle, appearance: 'none' }}>{options.map((o) => <option key={o} style={{ background: '#04111F' }}>{o}</option>)}</select> :
            <input name={name} required={required} placeholder={placeholder} onFocus={() => setFocus(true)} onBlur={() => setFocus(false)} style={inputStyle} />}
        </label>);
    };

    const FileField = ({ label, hint, multiple, onPick, name, required }) => {
      const [drag, setDrag] = React.useState(false);
      const [files, setFiles] = React.useState([]);
      const inputRef = React.useRef(null);
      const handle = (list) => {
        const arr = Array.from(list || []);
        setFiles(arr);
        if (onPick) onPick(arr);
      };
      return (
        <div>
          <span style={{ display: 'block', marginBottom: 8, fontFamily: 'var(--ko-font-display)', fontSize: 10.5, fontWeight: 900, letterSpacing: '0.18em', textTransform: 'uppercase', color: 'rgba(110,216,255,0.55)' }}>{label}</span>
          <div
            onClick={() => inputRef.current && inputRef.current.click()}
            onDragOver={(e) => { e.preventDefault(); setDrag(true); }}
            onDragLeave={() => setDrag(false)}
            onDrop={(e) => { e.preventDefault(); setDrag(false); handle(e.dataTransfer.files); }}
            style={{
              cursor: 'pointer',
              borderRadius: 16,
              border: '1px dashed ' + (drag ? 'rgba(110,216,255,0.55)' : 'rgba(110,216,255,0.22)'),
              background: drag ? 'rgba(24,183,255,0.08)' : 'rgba(255,255,255,0.025)',
              padding: '26px 22px',
              display: 'flex', alignItems: 'center', gap: 18,
              transition: 'all 220ms',
              boxShadow: drag ? '0 0 30px rgba(24,183,255,0.18)' : 'none',
            }}>
            <div style={{ flexShrink: 0, width: 52, height: 52, borderRadius: 14, background: 'rgba(24,183,255,0.10)', color: '#6ED8FF', display: 'flex', alignItems: 'center', justifyContent: 'center', border: '1px solid rgba(110,216,255,0.18)', boxShadow: '0 0 18px rgba(24,183,255,0.12)' }}>
              <Icon name="arrow-right" size={22} />
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              {files.length === 0 ?
                <>
                  <div style={{ fontFamily: 'var(--ko-font-display)', fontWeight: 800, fontSize: 15, color: '#fff' }}>Drop {multiple ? 'files' : 'your CV'} here, or click to browse</div>
                  <div style={{ marginTop: 4, fontSize: 13, color: 'rgba(255,255,255,0.50)' }}>{hint}</div>
                </> :
                <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                  {files.map((f, i) => (
                    <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 13.5, color: '#9EEBFF' }}>
                      <Icon name="check" size={14} /> <span style={{ color: '#fff', fontWeight: 600 }}>{f.name}</span>
                      <span style={{ color: 'rgba(255,255,255,0.45)' }}>· {(f.size / 1024).toFixed(0)} KB</span>
                    </div>
                  ))}
                  <div style={{ marginTop: 2, fontSize: 12, color: 'rgba(110,216,255,0.65)' }}>Click to replace</div>
                </div>}
            </div>
          </div>
          <input ref={inputRef} name={name} required={required} type="file" multiple={multiple} accept=".pdf,.doc,.docx,.rtf,.txt,.png,.jpg,.jpeg" onChange={(e) => handle(e.target.files)} style={{ display: 'none' }} />
        </div>
      );
    };

    const StepRow = ({ n, title, copy }) => (
      <div style={{ display: 'flex', gap: 16, alignItems: 'flex-start' }}>
        <div style={{ flexShrink: 0, width: 34, height: 34, borderRadius: 11, background: 'rgba(24,183,255,0.10)', border: '1px solid rgba(110,216,255,0.20)', color: '#6ED8FF', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'var(--ko-font-display)', fontWeight: 900, fontSize: 14 }}>{n}</div>
        <div>
          <div style={{ fontFamily: 'var(--ko-font-display)', fontWeight: 800, fontSize: 15.5, color: '#fff', letterSpacing: '-0.01em' }}>{title}</div>
          <div style={{ marginTop: 4, fontSize: 13.5, color: 'rgba(255,255,255,0.62)', lineHeight: 1.6 }}>{copy}</div>
        </div>
      </div>
    );

    const App = () => {
      const [submitted, setSubmitted] = React.useState(
        typeof window !== 'undefined' && /[?&]sent=1/.test(window.location.search)
      );
      const nextUrl = (typeof window !== 'undefined')
        ? window.location.origin + window.location.pathname + '?sent=1#apply'
        : '';
      return (
        <Page active="" footerCta={false}>
          <PageHero
            crumbs={[{label:'Home', href:'Klima Optima Homepage.html'},{label:'Careers'}]}
            eyebrow="Build with Klima Optima"
            headline="Send Us Your"
            headlineHighlight="CV."
            sub="We're always open to engineers, technicians, and operators who take climate control seriously. Share your CV and a few details, a member of our team will be in touch."
            ctas={<>
              <a href="#apply" className="ko-btn ko-btn-primary" style={{textDecoration:'none'}}>Submit Your CV <Icon name="arrow-right" size={18}/></a>
              <a href="contact.html" className="ko-btn ko-btn-secondary" style={{textDecoration:'none'}}>Contact Us</a>
            </>}
          />

          {/* Application form + how it works */}
          <SectionBand shade={1} id="apply">
            <div className="careers-apply-grid" style={{ display: 'grid', gridTemplateColumns: '1.1fr 0.9fr', gap: 56, alignItems: 'flex-start' }}>
              <Reveal>
                <GlassCard padding={40}>
                  <div style={{ fontFamily: 'var(--ko-font-display)', fontSize: 11, fontWeight: 900, letterSpacing: '0.22em', textTransform: 'uppercase', color: '#6ED8FF' }}>Application Form</div>
                  <h3 style={{ margin: '12px 0 0', fontFamily: 'var(--ko-font-display)', fontWeight: 900, fontSize: 32, color: '#fff', letterSpacing: '-0.01em' }}>Submit your CV</h3>
                  <p style={{ marginTop: 12, color: 'rgba(255,255,255,0.66)', fontSize: 15, lineHeight: 1.6 }}>Tell us a little about yourself and attach your CV. All files are encrypted and never shared outside our hiring team.</p>

                  {!submitted ?
                    <form action="https://formsubmit.co/hr@klimaoptima.com" method="POST" encType="multipart/form-data" style={{ marginTop: 32, display: 'flex', flexDirection: 'column', gap: 14 }}>
                      <input type="hidden" name="_subject" value="New CV submission, Klima Optima Careers" />
                      <input type="hidden" name="_template" value="table" />
                      <input type="hidden" name="_captcha" value="false" />
                      <input type="hidden" name="_next" value={nextUrl} />
                      <input type="text" name="_honey" tabIndex={-1} autoComplete="off" style={{ display: 'none' }} />
                      <div className="careers-field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
                        <Field name="Full name" required label="Full name" placeholder="Maria Cruz" />
                        <Field name="email" required label="Email" placeholder="maria@email.com" />
                      </div>
                      <div className="careers-field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
                        <Field name="Phone" label="Phone" placeholder="+63 ___ ____" />
                        <Field name="Location" label="Location" placeholder="Manila" />
                      </div>
                      <div className="careers-field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
                        <Field name="Area of interest" label="Area of interest" select options={['Engineering', 'Operations', 'Service & Field', 'Sales', 'Logistics', 'Trainee / Apprentice', 'Other']} />
                        <Field name="Experience" label="Experience" select options={['Student / Entry', '1-3 years', '3-6 years', '6-10 years', '10+ years']} />
                      </div>
                      <FileField name="CV" required label="Your CV" hint="PDF or Word, up to 10 MB" />
                      <FileField name="Supporting documents" label="Supporting documents" hint="Cover letter, certifications, portfolio, optional" multiple />
                      <Field name="Portfolio or LinkedIn" label="Portfolio or LinkedIn" optional placeholder="linkedin.com/in/…" />
                      <Field name="Message" label="Anything else we should know" textarea optional placeholder="A short note on your background, what you're looking for, and your availability." />
                      <button type="submit" className="ko-btn ko-btn-primary" style={{ marginTop: 12, justifyContent: 'center' }}>
                        Submit Application <Icon name="arrow-right" size={18} />
                      </button>
                      <p style={{ margin: '4px 0 0', textAlign: 'center', fontSize: 12.5, color: 'rgba(255,255,255,0.42)' }}>By submitting, you agree we may store your details for recruitment purposes.</p>
                    </form> :

                    <div style={{ marginTop: 32, padding: 32, borderRadius: 22, border: '1px solid rgba(110,216,255,0.30)', background: 'rgba(24,183,255,0.08)', textAlign: 'center' }}>
                      <div style={{ width: 64, height: 64, borderRadius: '50%', background: '#18B7FF', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', color: '#04111F', boxShadow: '0 0 40px rgba(24,183,255,0.55)' }}>
                        <Icon name="check" size={32} />
                      </div>
                      <h4 style={{ margin: '16px 0 0', fontFamily: 'var(--ko-font-display)', fontWeight: 900, fontSize: 22, color: '#fff' }}>Application received.</h4>
                      <p style={{ marginTop: 8, color: 'rgba(255,255,255,0.66)', fontSize: 15 }}>Thank you. If your background fits a current or upcoming need, our team will reach out within five business days.</p>
                      <button onClick={() => setSubmitted(false)} style={{ marginTop: 20, padding: '10px 24px', borderRadius: 9999, background: 'transparent', color: '#6ED8FF', border: '1px solid rgba(110,216,255,0.30)', cursor: 'pointer', fontFamily: 'var(--ko-font-display)', fontWeight: 700, fontSize: 13 }}>Submit another</button>
                    </div>}
                </GlassCard>
              </Reveal>

              <Reveal>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
                  <GlassCard padding={32} hoverable={false}>
                    <div style={{ fontFamily: 'var(--ko-font-display)', fontSize: 11, fontWeight: 900, letterSpacing: '0.22em', textTransform: 'uppercase', color: '#6ED8FF' }}>How It Works</div>
                    <div style={{ marginTop: 22, display: 'flex', flexDirection: 'column', gap: 22 }}>
                      <StepRow n="1" title="Submit your CV" copy="Send your CV with a few details. Applying to a specific role? Note it in the message field." />
                      <StepRow n="2" title="We review" copy="Our hiring team reviews every application against current and upcoming needs." />
                      <StepRow n="3" title="We reach out" copy="If there's a fit, we'll be in touch within five business days to arrange a first conversation." />
                    </div>
                  </GlassCard>

                  <a href="mailto:careers@klimaoptima.com?subject=Application%20%E2%80%94%20CV%20Submission" style={{ textDecoration: 'none', display: 'block' }}>
                    <ContactCard icon="globe" label="Prefer email?" main="careers@klimaoptima.com" sub="Attach your CV and we'll take it from there" />
                  </a>

                  <GlassCard padding={22} hoverable={false}>
                    <div style={{ display: 'flex', gap: 18, alignItems: 'flex-start' }}>
                      <div style={{ flexShrink: 0, width: 56, height: 56, borderRadius: 16, background: 'rgba(24,183,255,0.10)', color: '#6ED8FF', display: 'flex', alignItems: 'center', justifyContent: 'center', border: '1px solid rgba(110,216,255,0.18)' }}>
                        <Icon name="building" size={24} />
                      </div>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontFamily: 'var(--ko-font-display)', fontSize: 11, fontWeight: 900, letterSpacing: '0.22em', textTransform: 'uppercase', color: '#6ED8FF' }}>Office</div>
                        <div style={{ marginTop: 8, fontSize: 14, color: 'rgba(255,255,255,0.78)', lineHeight: 1.65 }}>2904-B Tektite West Tower, Philippine Stock Exchange Centre, Exchange Road, Ortigas Center, Pasig City, Philippines 1605</div>
                      </div>
                    </div>
                  </GlassCard>
                </div>
              </Reveal>
            </div>
          </SectionBand>
        </Page>
      );
    };

    const ContactCard = ({ icon, label, main, sub }) => {
      const [hov, setHov] = React.useState(false);
      return (
        <div onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)} style={{
          display: 'flex', gap: 18, alignItems: 'center', padding: 22,
          borderRadius: 22,
          border: '1px solid ' + (hov ? 'rgba(110,216,255,0.32)' : 'rgba(110,216,255,0.12)'),
          background: hov ? 'rgba(24,183,255,0.07)' : 'rgba(255,255,255,0.035)',
          backdropFilter: 'blur(20px)',
          transition: 'all 220ms'
        }}>
          <div style={{ flexShrink: 0, width: 56, height: 56, borderRadius: 16, background: hov ? '#18B7FF' : 'rgba(24,183,255,0.10)', color: hov ? '#04111F' : '#6ED8FF', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: hov ? '0 0 28px rgba(24,183,255,0.45)' : '0 0 18px rgba(24,183,255,0.12)', border: '1px solid rgba(110,216,255,0.18)', transition: 'all 220ms' }}>
            <Icon name={icon} size={24} />
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontFamily: 'var(--ko-font-display)', fontSize: 11, fontWeight: 900, letterSpacing: '0.22em', textTransform: 'uppercase', color: '#6ED8FF' }}>{label}</div>
            <div style={{ marginTop: 4, fontFamily: 'var(--ko-font-display)', fontWeight: 800, fontSize: 19, color: '#fff', letterSpacing: '-0.01em' }}>{main}</div>
            <div style={{ marginTop: 4, fontSize: 13, color: 'rgba(255,255,255,0.58)' }}>{sub}</div>
          </div>
          <span style={{ color: hov ? '#9EEBFF' : 'rgba(110,216,255,0.40)', transition: 'all 220ms', transform: hov ? 'translateX(2px)' : 'none' }}>
            <Icon name="arrow-right" size={20} />
          </span>
        </div>);
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>

  <style>
    /* Mobile: collapse the application form's two-column grids to single column */
    .careers-apply-grid > *, .careers-field-row > * { min-width: 0; }
    @media (max-width: 860px) {
      .careers-apply-grid { grid-template-columns: 1fr !important; gap: 24px !important; }
    }
    @media (max-width: 560px) {
      .careers-field-row { grid-template-columns: 1fr !important; }
    }
  </style>


<script src="security.js"></script>
<script src="contact-form-guard.js"></script>
</body>
</html>
