<head>

<title>Commercial Mobile Aircons, Klima Optima</title>

<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="image-slot.js"></script>
  <script type="text/babel" src="Icons.jsx"></script>
  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="PageShell.jsx"></script>

  <script type="text/babel">

/* ================================================================
   COMMERCIAL MOBILE AIRCONS, KC-27D, KC-60, KT-8000
   ================================================================ */

const PRODUCTS = [
  {
    model: 'KC-27D',
    name: 'DUO AC',
    titleImage: 'image 12.png',
    fullName: 'Klima Optima DUO AC KC-27D',
    btu: '9,000 BTU',
    tagline: 'Versatile dual-zone portable cooling',
    copy: 'The DUO AC KC-27D delivers 9,000 BTU of cooling power with dual-zone airflow capability, perfect for offices, hotels, retail spaces, and restaurants. Compact yet powerful, with plug-and-play setup and quiet operation for commercial environments.',
    features: [
      '9,000 BTU cooling capacity',
      'Dual-zone airflow distribution',
      'Quiet operation for occupied spaces',
      'Plug & play setup',
      'Digital temperature control',
    ],
    specs: [
      ['Cooling capacity', '9,000 BTU/h'],
      ['Airflow', 'Dual-zone'],
      ['Noise', 'Low operation'],
      ['Setup', 'Plug & play'],
      ['Control', 'Digital'],
      ['Refrigerant', 'R410A'],
    ],
    applications: ['Offices', 'Hotels', 'Retail', 'Restaurants', 'Events'],
    color: '#6ED8FF',
    specSheet: 'assets/specs/KC-27D.pdf',
  },
  {
    model: 'KC-60',
    name: 'Blizzard Box',
    titleImage: 'image 13.png',
    fullName: 'Klima Optima Blizzard Box KC-60',
    btu: '12,000 BTU',
    tagline: 'High-capacity commercial cooling',
    copy: 'The Blizzard Box KC-60 provides 12,000 BTU of powerful cooling for medium-to-large commercial spaces. Heavy-duty construction with portable design makes it ideal for hospitality venues, larger offices, and event spaces.',
    features: [
      '12,000 BTU cooling power',
      'Heavy-duty commercial construction',
      'Wide airflow coverage',
      'Easy mobility with castor wheels',
      'Continuous drain option',
    ],
    specs: [
      ['Cooling capacity', '12,000 BTU/h'],
      ['Build', 'Heavy-duty'],
      ['Mobility', 'Castor wheels'],
      ['Drainage', 'Continuous'],
      ['Setup', 'Plug & play'],
      ['Refrigerant', 'R410A'],
    ],
    applications: ['Hospitality', 'Offices', 'Events', 'Retail', 'Commercial'],
    color: '#9EEBFF',
    specSheet: 'assets/specs/KC-60.png',
  },
  {
    model: 'KT-8000',
    name: 'Triton AC',
    titleImage: 'image 14.png',
    fullName: 'Klima Optima Triton AC KT-8000',
    btu: '24,000 BTU',
    tagline: 'Maximum commercial cooling power',
    copy: 'The Triton AC KT-8000 delivers 24,000 BTU of premium cooling for the most demanding commercial applications. Triple-zone airflow with advanced control makes it perfect for large hospitality venues, expansive offices, and major event spaces.',
    features: [
      'Maximum 24,000 BTU cooling capacity',
      'Triple-zone airflow distribution',
      'Advanced digital control interface',
      'Premium commercial-grade construction',
      'Auto-restart and timer functions',
    ],
    specs: [
      ['Cooling capacity', '24,000 BTU/h'],
      ['Airflow', 'Triple-zone'],
      ['Control', 'Digital interface'],
      ['Features', 'Auto-restart, timer'],
      ['Build', 'Premium commercial'],
      ['Refrigerant', 'R410A'],
    ],
    applications: ['Large hospitality', 'Premium offices', 'Major events', 'Showrooms', 'Commercial'],
    color: '#18B7FF',
    specSheet: 'assets/specs/Triton-AC.pdf',
  }
];

const ProductBlock = ({ p, reverse }) => {
  const [hov, setHov] = React.useState(false);
  return (
    <div onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      style={{
        display: 'grid', gridTemplateColumns: reverse ? '1fr 1fr' : '1fr 1fr', gap: 0, alignItems: 'stretch',
        borderRadius: 40, overflow: 'hidden',
        border: '1px solid ' + (hov ? 'rgba(110,216,255,0.30)' : 'rgba(110,216,255,0.12)'),
        background: 'linear-gradient(135deg, rgba(10,35,66,0.50), rgba(6,23,40,0.85))',
        backdropFilter: 'blur(20px)',
        boxShadow: hov ? '0 40px 120px rgba(0,0,0,0.50), 0 0 80px rgba(24,183,255,0.12)' : '0 30px 110px rgba(0,0,0,0.40)',
        transition: 'all 320ms cubic-bezier(0.22,1,0.36,1)',
        minHeight: 620
      }}>
      <div style={{
        order: reverse ? 2 : 1,
        display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
        padding: '72px 56px', position: 'relative',
        background: 'radial-gradient(circle at 50% 40%, rgba(24,183,255,0.10), transparent 65%)'
      }}>
        <div style={{ position: 'absolute', inset: 0, opacity: 0.03, backgroundImage: 'linear-gradient(90deg, rgba(110,216,255,0.7) 1px, transparent 1px), linear-gradient(rgba(110,216,255,0.7) 1px, transparent 1px)', backgroundSize: '40px 40px', pointerEvents: 'none' }} />
        
        {p.logo &&
          <div style={{ position: 'absolute', top: 40, left: reverse ? 'auto' : 40, right: reverse ? 40 : 'auto', zIndex: 3 }}>
            <img src={p.logo} alt={p.name} style={{ height: 60, objectFit: 'contain', filter: hov ? 'drop-shadow(0 10px 30px rgba(24,183,255,0.40))' : 'drop-shadow(0 6px 16px rgba(0,0,0,0.35))', transition: 'filter 320ms' }} />
          </div>
        }
        
        <div style={{ position: 'relative', width: '100%', flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: 400, transform: hov ? 'translateY(-8px) scale(1.03)' : 'scale(1)', transition: 'transform 400ms cubic-bezier(0.22,1,0.36,1)', zIndex: 2 }}>
          <image-slot
            id={`product-${p.model}`}
            placeholder={`Drop ${p.name} product photo here`}
            shape="rounded" radius="18"
            style={{
              width: '400px',
              height: '400px',
              minHeight: '400px',
              borderRadius: '24px',
              border: '2px solid rgba(110,216,255,0.20)',
              background: 'rgba(6,23,40,0.60)',
              boxShadow: hov ? '0 30px 80px rgba(0,0,0,0.6), 0 0 60px rgba(24,183,255,0.15)' : '0 20px 60px rgba(0,0,0,0.5)',
              transition: 'all 320ms'
            }} />
        </div>
        
        <div style={{ position: 'absolute', bottom: '10%', width: '75%', height: '35%', background: `radial-gradient(ellipse, ${p.color}50, transparent 70%)`, filter: 'blur(60px)', pointerEvents: 'none', opacity: hov ? 1 : 0.7, transition: 'opacity 320ms', zIndex: 1 }} />
      </div>

      <div style={{ order: reverse ? 1 : 2, padding: '56px 56px', display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14, flexWrap: 'wrap' }}>
          <span style={{ fontFamily: 'var(--ko-font-mono)', fontSize: 12, color: p.color, letterSpacing: '0.12em', padding: '6px 16px', borderRadius: 9999, border: `1px solid ${p.color}33`, background: `${p.color}12`, fontWeight: 600 }}>{p.model}</span>
          <span style={{ fontFamily: 'var(--ko-font-display)', fontSize: 10.5, fontWeight: 900, letterSpacing: '0.20em', textTransform: 'uppercase', color: 'rgba(110,216,255,0.50)' }}>Commercial Grade</span>
        </div>
        <div style={{ marginTop: 24, width: '100%', maxWidth: 420 }}>
          <image-slot
            id={`product-title-${p.model}`}
            placeholder={`Drop ${p.titleImage} here`}
            shape="rounded" radius="18"
            style={{
              width: '100%',
              height: '80px',
              minHeight: '80px',
              borderRadius: '12px',
              border: '1px solid rgba(110,216,255,0.30)',
              background: 'rgba(6,23,40,0.40)'
            }} />
        </div>
        <div style={{ marginTop: 10, fontFamily: 'var(--ko-font-display)', fontSize: 15, color: p.color, fontWeight: 700, letterSpacing: '0.01em' }}>{p.btu} · {p.tagline}</div>
        <p style={{ marginTop: 22, color: 'rgba(255,255,255,0.70)', lineHeight: 1.70, fontSize: 16 }}>{p.copy}</p>
        <div style={{ marginTop: 24, display: 'flex', flexDirection: 'column', gap: 10 }}>
          {p.features.map((f, i) =>
            <div key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: 12 }}>
              <span style={{ flexShrink: 0, width: 20, height: 20, borderRadius: 6, background: 'rgba(24,183,255,0.12)', color: '#18B7FF', display: 'flex', alignItems: 'center', justifyContent: 'center', marginTop: 2 }}>
                <Icon name="check" size={12} />
              </span>
              <span style={{ color: 'rgba(255,255,255,0.80)', fontSize: 14, lineHeight: 1.5 }}>{f}</span>
            </div>
          )}
        </div>
        <div style={{ marginTop: 24, display: 'flex', flexWrap: 'wrap', gap: 8 }}>
          {p.applications.map((a) => <Tag key={a}>{a}</Tag>)}
        </div>
        <div style={{ marginTop: 28, display: 'flex', gap: 14 }}>
          <a href="contact.html" className="ko-btn ko-btn-primary" style={{ textDecoration: 'none', fontSize: 13 }}>Inquire <Icon name="arrow-right" size={16} /></a>
          <a href={p.specSheet || 'resources.html'} {...(p.specSheet ? { download: true, target: '_blank', rel: 'noopener' } : {})} className="ko-btn ko-btn-secondary" style={{ textDecoration: 'none', fontSize: 13 }}>Download Spec Sheet</a>
        </div>
      </div>
    </div>);
};

const thS = { padding: '18px 24px', textAlign: 'left', fontFamily: 'var(--ko-font-display)', fontWeight: 900, fontSize: 11.5, letterSpacing: '0.18em', textTransform: 'uppercase', color: '#6ED8FF' };
const tdS = { padding: '16px 24px', textAlign: 'left', color: 'rgba(255,255,255,0.72)', fontFamily: 'var(--ko-font-mono)', fontSize: 13, letterSpacing: '0.02em' };

const App = () =>
  <Page active="Products">
    <PageHero
      crumbs={[
        { label: 'Home', href: 'Klima Optima Homepage.html' },
        { label: 'Products', href: 'products.html' },
        { label: 'Air Conditioners', href: 'air-conditioners.html' },
        { label: 'Commercial Mobile Aircons' }
      ]}
      eyebrow="Commercial Mobile Aircons"
      headline="Commercial Mobile"
      headlineHighlight="Aircons."
      sub="Portable air conditioners engineered for offices, hospitality, retail, restaurants, and events. From compact dual-zone cooling to maximum-capacity premium units."
      ctas={<>
        <a href="#products" className="ko-btn ko-btn-primary" style={{ textDecoration: 'none' }}>View Products <Icon name="arrow-right" size={18} /></a>
        <a href="contact.html" className="ko-btn ko-btn-secondary" style={{ textDecoration: 'none' }}>Request Consultation</a>
      </>} />

    <SectionBand shade={1} id="products">
      <div style={{ display: 'flex', flexDirection: 'column', gap: 40 }}>
        {PRODUCTS.map((p, i) =>
          <Reveal key={p.model}>
            <ProductBlock p={p} reverse={i % 2 === 1} />
          </Reveal>
        )}
      </div>
    </SectionBand>

    <SectionBand shade={2}>
      <Reveal>
        <SectionHead align="center" eyebrow="Comparison" title="Side-by-Side" titleHighlight="Specifications." />
        <div style={{ marginTop: 56, borderRadius: 30, border: '1px solid rgba(110,216,255,0.16)', background: 'rgba(255,255,255,0.04)', backdropFilter: 'blur(20px)', overflow: 'hidden', boxShadow: '0 30px 100px rgba(0,0,0,0.4)' }}>
          <table style={{ width: '100%', borderCollapse: 'collapse', color: '#fff', fontFamily: 'var(--ko-font-body)', fontSize: 14 }}>
            <thead>
              <tr style={{ background: 'rgba(24,183,255,0.06)' }}>
                <th style={thS}>Spec</th>
                <th style={thS}>DUO AC (KC-27D)</th>
                <th style={thS}>Blizzard Box (KC-60)</th>
                <th style={thS}>Triton AC (KT-8000)</th>
              </tr>
            </thead>
            <tbody>
              {[
                ['Cooling capacity', '9,000 BTU/h', '12,000 BTU/h', '24,000 BTU/h'],
                ['Airflow', 'Dual-zone', 'Wide coverage', 'Triple-zone'],
                ['Build', 'Compact', 'Heavy-duty', 'Premium commercial'],
                ['Refrigerant', 'R410A', 'R410A', 'R410A'],
                ['Drainage', 'Standard', 'Continuous', 'Continuous'],
                ['Control', 'Digital', 'Digital', 'Advanced digital'],
                ['Best for', 'Small commercial', 'Medium commercial', 'Large commercial']
              ].map((row, i) =>
                <tr key={i} style={{ borderTop: '1px solid rgba(110,216,255,0.08)' }}>
                  <td style={{ ...tdS, fontWeight: 700, color: 'rgba(255,255,255,0.86)' }}>{row[0]}</td>
                  {row.slice(1).map((v, j) => <td key={j} style={tdS}>{v}</td>)}
                </tr>
              )}
            </tbody>
          </table>
        </div>
      </Reveal>
    </SectionBand>

    <SectionBand shade={0}>
      <Reveal>
        <SectionHead align="center" eyebrow="Also Explore" title="Other Cooling" titleHighlight="Categories." />
        <div style={{ marginTop: 56, display: 'grid', gridTemplateColumns: 'repeat(2,1fr)', gap: 18 }}>
          <FeatureCard icon="snowflake" title="Industrial Portable Aircons" copy="Heavy-duty portable AC for factories, warehouses, and workshops. From 15,300 to 22,000 BTU." link={{ label: 'View range', href: 'industrial-portable-aircons.html' }} />
          <FeatureCard icon="wind" title="Hybrid Aircon" copy="Energy-efficient hybrid cooling combining evaporative and refrigerant cycles." link={{ label: 'View range', href: 'hybrid-ac.html' }} />
        </div>
      </Reveal>
    </SectionBand>

    <CTABand
      eyebrow="Need Aircons?"
      title="Talk To Us"
      sub="Surface area, heat load, occupancy, operational hours, we'll size and spec the right aircons for your space."
      primary={{ label: 'Request Consultation', href: 'contact.html' }}
      secondary={{ label: 'Download Catalog', href: 'assets/catalog/Klima-Optima-Catalog.pdf', download: true }} />

  </Page>;

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>


<script src="security.js"></script>
