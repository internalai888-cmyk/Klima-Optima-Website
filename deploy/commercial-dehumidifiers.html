<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script src="resilience.js"></script>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net https://www.googletagmanager.com https://www.google-analytics.com https://www.google.com https://www.gstatic.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; frame-src https://www.google.com https://www.youtube.com; connect-src 'self' https://unpkg.com https://cdn.jsdelivr.net https://www.google-analytics.com https://formsubmit.co; object-src 'none'; base-uri 'self'; form-action 'self' https://formsubmit.co;">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commercial Dehumidifiers, Klima Optima</title>
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="image-slot.js"></script>
  <script type="text/babel" src="Icons.jsx"></script>
  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="PageShell.jsx"></script>

  <script type="text/babel">
    const PRODUCTS = [
      {
        model: 'KD-870G',
        name: 'Commercial Dehumidifier',
        titleImage: 'image 2.png',
        fullName: 'Klima Optima KD-870G Commercial Dehumidifier',
        capacity: '70 L/day',
        tagline: 'Compact powerhouse for business-grade humidity control',
        copy: 'The Klima Optima KD-870G delivers powerful dehumidification in a compact unit. With a rated capacity of 70L/day (30°C, 80% RH) and efficient 735W power use, it\'s ideal for businesses that need strong, reliable moisture control without the bulk. Engineered for offices, commissaries, hotels, laboratories, and retail spaces, the KD-870G prevents mold, mildew, and equipment damage caused by high humidity.',
        features: [
          'Intelligent Humidity Control with Auto Defrosting',
          'Continuous Drain & Intelligent Memory Function',
          'Wide-Angle Dehumidifying Surface for maximum coverage',
          'Heavy-Duty Handle & Compact Design for portability',
          'A++ Filter Screen & Circulating Air System',
        ],
        specs: [
          ['Extraction', '70 L / day (30°C, 80% RH)'],
          ['Power', '735W'],
          ['Application', 'Offices, hotels, labs, retail'],
          ['Features', 'Auto defrosting, continuous drain'],
          ['Design', 'Compact with heavy-duty handle'],
          ['Filter', 'A++ Filter Screen'],
        ],
        applications: ['Offices', 'Commissaries', 'Hotels', 'Laboratories', 'Retail spaces'],
        color: '#6ED8FF',
        specSheet: 'assets/specs/KD-870G.png',
      },
      {
        model: 'KD-8138G',
        name: 'Commercial/Industrial Dehumidifier',
        titleImage: 'image 3.png',
        fullName: 'Klima Optima KD-8138G Commercial/Industrial Dehumidifier',
        capacity: '138 L/day',
        tagline: 'Heavy-duty moisture control for industrial spaces',
        copy: 'The Klima Optima KD-8138G is built for tough environments where humidity poses serious risks. With a massive 138L/day capacity (35°C, 90% RH) and a powerful 1200W system, it safeguards your business from mold, rust, mildew, and structural damage. Perfect for warehouses, hospitals, data centers, archives, production areas, and storage facilities, this unit ensures consistent, reliable dehumidification.',
        features: [
          'Intelligent Humidity Control for precision drying',
          'Automatic Defrosting for uninterrupted operation',
          'Bi-directional Timing & Intelligent Memory',
          'A++ Filter Screen with Wide-Angle Dehumidification',
          'Circulating Air System for even coverage',
          'Heavy-Duty Handle & Side Drain for easy use',
        ],
        specs: [
          ['Extraction', '138 L / day (35°C, 90% RH)'],
          ['Power', '1200W'],
          ['Application', 'Warehouses, hospitals, data centers'],
          ['Features', 'Auto defrost, bi-directional timing'],
          ['Coverage', 'Wide-angle dehumidification'],
          ['Design', 'Heavy-duty with side drain'],
        ],
        applications: ['Warehouses', 'Hospitals', 'Data centers', 'Archives', 'Production areas', 'Storage facilities'],
        color: '#9EEBFF',
        specSheet: 'assets/specs/KD-8138G.png',
      },
    ];

    const ProductBlock = ({p, reverse}) => {
      const [hov, setHov] = React.useState(false);
      return (
        <div onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
          style={{
            display:'grid', gridTemplateColumns: reverse ? '0.9fr 1.1fr' : '1.1fr 0.9fr', gap: 0, alignItems:'stretch',
            borderRadius: 40, overflow:'hidden',
            border:'1px solid ' + (hov ? 'rgba(110,216,255,0.30)' : 'rgba(110,216,255,0.12)'),
            background:'linear-gradient(135deg, rgba(10,35,66,0.50), rgba(6,23,40,0.85))',
            backdropFilter:'blur(20px)',
            boxShadow: hov ? '0 40px 120px rgba(0,0,0,0.50), 0 0 80px rgba(24,183,255,0.12)' : '0 30px 110px rgba(0,0,0,0.40)',
            transition:'all 320ms cubic-bezier(0.22,1,0.36,1)',
            minHeight: 560,
          }}>
          <div style={{
            order: reverse ? 2 : 1,
            display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
            padding: '64px 48px', position:'relative',
            background:'radial-gradient(circle at 50% 40%, rgba(24,183,255,0.12), transparent 60%)',
          }}>
            <div style={{position:'absolute', inset:0, opacity:0.04, backgroundImage:'linear-gradient(90deg, rgba(110,216,255,0.7) 1px, transparent 1px), linear-gradient(rgba(110,216,255,0.7) 1px, transparent 1px)', backgroundSize:'32px 32px', pointerEvents:'none'}}/>
            <div style={{position:'relative', width:'100%', flex: 1, display:'flex', alignItems:'center', justifyContent:'center', minHeight: 400, transform: hov ? 'translateY(-8px) scale(1.03)' : 'scale(1)', transition:'transform 400ms cubic-bezier(0.22,1,0.36,1)', zIndex: 2}}>
              <image-slot 
                id={`product-${p.model}`}
                placeholder={`Drop ${p.name} product photo here`}
                shape="rounded" radius="18"
                style={{
                  width: '400px',
                  height: '400px',
                  minHeight: '400px',
                  borderRadius: '24px',
                  border: '2px solid rgba(110,216,255,0.20)',
                  background: 'rgba(6,23,40,0.60)',
                  boxShadow: hov ? '0 30px 80px rgba(0,0,0,0.6), 0 0 60px rgba(24,183,255,0.15)' : '0 20px 60px rgba(0,0,0,0.5)',
                  transition: 'all 320ms',
                }}
              />
            </div>
            <div style={{position:'absolute', bottom: '15%', width: '80%', height: '30%', background:`radial-gradient(ellipse, ${p.color}40, transparent 65%)`, filter:'blur(50px)', pointerEvents:'none', opacity: hov ? 1 : 0.6, transition:'opacity 320ms'}}/>
          </div>

          <div style={{order: reverse ? 1 : 2, padding: '56px 56px', display:'flex', flexDirection:'column', justifyContent:'center'}}>
            <div style={{display:'flex', alignItems:'center', gap: 14, flexWrap:'wrap'}}>
              <span style={{fontFamily:'var(--ko-font-mono)', fontSize: 12, color: p.color, letterSpacing:'0.12em', padding:'6px 16px', borderRadius: 9999, border:`1px solid ${p.color}33`, background:`${p.color}12`, fontWeight: 600}}>{p.model}</span>
              <span style={{fontFamily:'var(--ko-font-display)', fontSize: 10.5, fontWeight: 900, letterSpacing:'0.20em', textTransform:'uppercase', color:'rgba(110,216,255,0.50)'}}>Commercial Grade</span>
            </div>
            <div style={{marginTop: 24, width:'100%', maxWidth: 420}}>
              <image-slot 
                id={`product-title-${p.model}`}
                placeholder={`Drop ${p.titleImage} here`}
                shape="rounded" radius="18"
                style={{
                  width: '100%',
                  height: '80px',
                  minHeight: '80px',
                  borderRadius: '12px',
                  border: '1px solid rgba(110,216,255,0.30)',
                  background: 'rgba(6,23,40,0.40)',
                }}
              />
            </div>
            <div style={{marginTop: 10, fontFamily:'var(--ko-font-display)', fontSize: 15, color: p.color, fontWeight: 700, letterSpacing:'0.01em'}}>{p.capacity} · {p.tagline}</div>
            <p style={{marginTop: 22, color:'rgba(255,255,255,0.70)', lineHeight: 1.70, fontSize: 16}}>{p.copy}</p>
            <div style={{marginTop: 24, display:'flex', flexDirection:'column', gap: 10}}>
              {p.features.map((f, i) => (
                <div key={i} style={{display:'flex', alignItems:'flex-start', gap: 12}}>
                  <span style={{flexShrink:0, width: 20, height: 20, borderRadius: 6, background:'rgba(24,183,255,0.12)', color:'#18B7FF', display:'flex', alignItems:'center', justifyContent:'center', marginTop: 2}}>
                    <Icon name="check" size={12}/>
                  </span>
                  <span style={{color:'rgba(255,255,255,0.80)', fontSize: 14, lineHeight: 1.5}}>{f}</span>
                </div>
              ))}
            </div>
            <div style={{marginTop: 24, display:'flex', flexWrap:'wrap', gap: 8}}>
              {p.applications.map(a => <Tag key={a}>{a}</Tag>)}
            </div>
            <div style={{marginTop: 28, display:'flex', gap: 14}}>
              <a href="contact.html" className="ko-btn ko-btn-primary" style={{textDecoration:'none', fontSize: 13}}>Inquire <Icon name="arrow-right" size={16}/></a>
              <a href={p.specSheet || 'resources.html'} {...(p.specSheet ? { download: true, target: '_blank', rel: 'noopener' } : {})} className="ko-btn ko-btn-secondary" style={{textDecoration:'none', fontSize: 13}}>Download Spec Sheet</a>
            </div>
          </div>
        </div>
      );
    };

    const BENEFITS = [
      ['droplet', 'Prevent Moisture Accumulation', 'Stops moisture buildup in large commercial environments before it leads to structural damage or operational issues.'],
      ['bacteria', 'Reduce Mold Contamination Risk', 'Prevents mold growth in occupied commercial spaces that can compromise air quality and create health concerns.'],
      ['wind', 'Help Prevent Equipment Corrosion', 'Reduces corrosion and moisture damage to commercial equipment, fixtures, and infrastructure.'],
      ['shield', 'Minimize Condensation Effects', 'Prevents condensation that damages surfaces, stored materials, and inventory in commercial operations.'],
      ['smoke', 'Reduce IAQ Issues', 'Eliminates humidity-related indoor air quality problems that affect employee comfort and productivity.'],
      ['warehouse', 'Protect Stored Goods', 'Safeguards inventory, products, and materials from moisture exposure, packaging damage, and quality degradation.'],
    ];

    const thS = {padding:'18px 24px', textAlign:'left', fontFamily:'var(--ko-font-display)', fontWeight: 900, fontSize: 11.5, letterSpacing:'0.18em', textTransform:'uppercase', color:'#6ED8FF'};
    const tdS = {padding:'16px 24px', textAlign:'left', color:'rgba(255,255,255,0.72)', fontFamily:'var(--ko-font-mono)', fontSize: 13, letterSpacing:'0.02em'};

    const App = () => (
      <Page active="Products">
        <PageHero
          crumbs={[
            {label:'Home', href:'Klima Optima Homepage.html'},
            {label:'Products', href:'products.html'},
            {label:'Dehumidifiers', href:'dehumidifiers.html'},
            {label:'Commercial & Industrial Floorstanding', href:'commercial-industrial-floorstanding-dehumidifiers.html'},
            {label:'Commercial'},
          ]}
          eyebrow="Commercial Dehumidifiers"
          headline="Commercial"
          headlineHighlight="Dehumidifiers."
          sub="Powerful dehumidification engineered for businesses that need strong, reliable moisture control. Prevents mold, mildew, and equipment damage in offices, warehouses, hotels, and commercial facilities."
          ctas={<>
            <a href="#products" className="ko-btn ko-btn-primary" style={{textDecoration:'none'}}>View Products <Icon name="arrow-right" size={18}/></a>
            <a href="contact.html" className="ko-btn ko-btn-secondary" style={{textDecoration:'none'}}>Request Consultation</a>
          </>}
        />

        <SectionBand shade={1} id="products">
          <div style={{display:'flex', flexDirection:'column', gap: 40}}>
            {PRODUCTS.map((p, i) => (
              <Reveal key={p.model}>
                <ProductBlock p={p} reverse={i % 2 === 1}/>
              </Reveal>
            ))}
          </div>
        </SectionBand>

        <SectionBand shade={2}>
          <Reveal>
            <SectionHead align="center" eyebrow="Prevention & Risk Mitigation" title="What Problems Are" titleHighlight="Being Prevented?"/>
            <div style={{marginTop: 56, display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap: 18}}>
              {BENEFITS.map(([ic,t,c]) => <FeatureCard key={t} icon={ic} title={t} copy={c}/>)}
            </div>
          </Reveal>
        </SectionBand>

        <SectionBand shade={0}>
          <Reveal>
            <SectionHead align="center" eyebrow="Comparison" title="Side-by-Side" titleHighlight="Specifications."/>
            <div style={{marginTop: 56, borderRadius: 30, border:'1px solid rgba(110,216,255,0.16)', background:'rgba(255,255,255,0.04)', backdropFilter:'blur(20px)', overflow:'hidden', boxShadow:'0 30px 100px rgba(0,0,0,0.4)'}}>
              <table style={{width:'100%', borderCollapse:'collapse', color:'#fff', fontFamily:'var(--ko-font-body)', fontSize: 14}}>
                <thead>
                  <tr style={{background:'rgba(24,183,255,0.06)'}}>
                    <th style={thS}>Spec</th>
                    <th style={thS}>KD-870G</th>
                    <th style={thS}>KD-8138G</th>
                  </tr>
                </thead>
                <tbody>
                  {[
                    ['Extraction capacity', '70 L/day (30°C, 80% RH)', '138 L/day (35°C, 90% RH)'],
                    ['Power consumption', '735W', '1200W'],
                    ['Application', 'Offices, hotels, labs, retail', 'Warehouses, hospitals, data centers'],
                    ['Features', 'Auto defrost, continuous drain', 'Auto defrost, bi-directional timing'],
                    ['Design', 'Compact with heavy-duty handle', 'Heavy-duty with side drain'],
                    ['Best for', 'Business-grade control', 'Industrial spaces'],
                  ].map((row, i) => (
                    <tr key={i} style={{borderTop:'1px solid rgba(110,216,255,0.08)'}}>
                      <td style={{...tdS, fontWeight: 700, color:'rgba(255,255,255,0.86)'}}>{row[0]}</td>
                      {row.slice(1).map((v, j) => <td key={j} style={tdS}>{v}</td>)}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </Reveal>
        </SectionBand>

        <SectionBand shade={1}>
          <Reveal>
            <SectionHead align="center" eyebrow="Also Explore" title="Other Dehumidifier" titleHighlight="Categories."/>
            <div style={{marginTop: 56, display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap: 18}}>
              <FeatureCard icon="droplet" title="Light Commercial Dehumidifiers" copy="30-90 L/day for offices, condos, healthcare, and medium commercial spaces." link={{label:'View range', href:'light-commercial-dehumidifiers.html'}}/>
              <FeatureCard icon="wind" title="Industrial Dehumidifiers" copy="200-500+ L/day for manufacturing, data centers, and critical environments." link={{label:'View range', href:'industrial-dehumidifiers.html'}}/>
            </div>
          </Reveal>
        </SectionBand>

        <CTABand
          eyebrow="Need a Dehumidifier?"
          title="Talk to Us"
          sub="Tell us about your space, surface area, humidity levels, and operational needs, and we'll come back with a sized proposal."
          primary={{label:'Request Consultation', href:'contact.html'}}
          secondary={{label:'Download Catalog', href:'assets/catalog/Commercial-Dehumidifiers-Catalog.pdf', download:true}}
        />
      </Page>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>


<script src="security.js"></script>
</body>
</html>
