<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script src="resilience.js"></script>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net https://www.googletagmanager.com https://www.google-analytics.com https://www.google.com https://www.gstatic.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; frame-src https://www.google.com https://www.youtube.com; connect-src 'self' https://unpkg.com https://cdn.jsdelivr.net https://www.google-analytics.com https://formsubmit.co; object-src 'none'; base-uri 'self'; form-action 'self' https://formsubmit.co;">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hybrid Aircon, Klima Optima</title>
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="image-slot.js"></script>
  <script type="text/babel" src="Icons.jsx"></script>
  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="PageShell.jsx"></script>

  <script type="text/babel">
    /* ================================================================
       HYBRID AC, KCH-9000
       ================================================================ */

    /* --- Hybrid unit SVG render --- */
    const HybridRender = ({hov}) => (
      <svg viewBox="0 0 240 400" style={{height:'100%', width:'auto', filter: hov ? 'drop-shadow(0 30px 50px rgba(24,183,255,0.22)) drop-shadow(0 0 40px rgba(30,200,130,0.12))' : 'drop-shadow(0 16px 30px rgba(0,0,0,0.5))', transition:'filter 300ms'}}>
        <defs>
          <linearGradient id="hybBody2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#1e293b"/><stop offset="60%" stopColor="#0f172a"/><stop offset="100%" stopColor="#020617"/>
          </linearGradient>
          <linearGradient id="hybEco" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stopColor="#0e8ed0"/><stop offset="50%" stopColor="#18B7FF"/><stop offset="100%" stopColor="rgba(30,200,130,0.8)"/>
          </linearGradient>
        </defs>
        <ellipse cx="120" cy="390" rx="60" ry="6" fill="#000" opacity="0.35"/>
        {/* Main body */}
        <rect x="35" y="15" width="170" height="370" rx="20" fill="url(#hybBody2)" stroke="rgba(110,216,255,0.28)" strokeWidth="1.2"/>
        {/* Top vent rack */}
        <rect x="50" y="26" width="140" height="20" rx="5" fill="#0a0f1c"/>
        <g stroke="rgba(24,183,255,0.35)" strokeWidth="0.8">
          {Array.from({length:14}).map((_,i)=><line key={i} x1={56+i*10} y1="29" x2={56+i*10} y2="43"/>)}
        </g>
        {/* Display panel */}
        <rect x="50" y="58" width="140" height="60" rx="8" fill="#04111F" stroke="rgba(24,183,255,0.35)"/>
        <text x="120" y="78" fill="#6ED8FF" fontFamily="monospace" fontSize="8" textAnchor="middle" letterSpacing="2">HYBRID MODE</text>
        <rect x="62" y="86" width="116" height="22" rx="4" fill="url(#hybEco)" opacity="0.85"/>
        <text x="120" y="101" fill="#04111F" fontFamily="monospace" fontSize="11" fontWeight="800" textAnchor="middle">ECO · 9,000 m³/h</text>
        {/* Large front intake grill */}
        <rect x="50" y="130" width="140" height="170" rx="12" fill="#0a0f1c"/>
        <g stroke="rgba(24,183,255,0.35)" strokeWidth="0.8">
          {Array.from({length:17}).map((_,i)=><line key={i} x1="58" y1={140+i*9.5} x2="182" y2={140+i*9.5}/>)}
        </g>
        {/* Center eco badge */}
        <circle cx="120" cy="215" r="22" fill="rgba(30,200,130,0.10)" stroke="rgba(30,200,130,0.35)" strokeWidth="1.2"/>
        <path d="M114 222 q6 -14 12 -10 q-4 10 -10 14z" fill="rgba(30,200,130,0.65)"/>
        <path d="M116 218 q4 -10 8 -7 q-2 7 -7 10z" fill="rgba(30,200,130,0.40)"/>
        {/* Water tank indicator */}
        <rect x="50" y="312" width="140" height="40" rx="8" fill="#0a0f1c" stroke="rgba(110,216,255,0.15)"/>
        <text x="62" y="328" fill="rgba(110,216,255,0.55)" fontFamily="monospace" fontSize="7" letterSpacing="2">TANK · 100L</text>
        <rect x="60" y="335" width="120" height="8" rx="3" fill="rgba(24,183,255,0.12)"/>
        <rect x="60" y="335" width="80" height="8" rx="3" fill="#18B7FF" opacity={hov?1:0.8}>
          {hov && <animate attributeName="width" values="78;82;78" dur="2s" repeatCount="indefinite"/>}
        </rect>
        {/* LED strip */}
        <rect x="50" y="362" width="140" height="6" rx="3" fill="url(#hybEco)" opacity={hov?1:0.75}>
          {hov && <animate attributeName="opacity" values="0.7;1;0.7" dur="1.8s" repeatCount="indefinite"/>}
        </rect>
        {/* Side rim */}
        <rect x="35" y="15" width="4" height="370" fill="rgba(110,216,255,0.18)"/>
        <rect x="201" y="15" width="4" height="370" fill="rgba(0,0,0,0.5)"/>
      </svg>
    );

    const FEATURES = [
      ['snowflake', 'Patented Hybrid Cooling System',    'Combines evaporative and refrigerant cycles for powerful cooling that works in both dry and humid conditions.'],
      ['wind',      'Massive 9,000 m³/h Airflow',        'High-velocity airflow covers large open and semi-outdoor areas effectively.'],
      ['gauge',     'Energy Efficient Operation',         'Hybrid cycle reduces power consumption compared to pure refrigerant systems, 1,180W max draw.'],
      ['palm',      'Built for Outdoor & Semi-Outdoor',   'Designed for al fresco dining, gardens, warehouses, gyms, and open commercial venues.'],
      ['plug',      'Portable Plug & Play',               'Castor-mounted, 100L tank, R410A refrigerant. Roll it in, plug in, cool down.'],
      ['fan',       '3-Speed Fan Control',                'Adjust airflow to match the space and occupancy, from gentle to maximum blast.'],
    ];

    const SPECS = [
      ['Model',              'KCH-9000'],
      ['Power source',       '220V / 60Hz'],
      ['Max airflow',        '9,000 m³/h'],
      ['Max current',        '5.3 A'],
      ['Max power',          '1,180 W'],
      ['Refrigerant',        'R410A'],
      ['Fan speeds',         '3'],
      ['Water tank',         '100 L'],
      ['Net weight',         '61 kg'],
      ['Dimensions (mm)',    '790 × 520 × 1,350'],
    ];

    const APPLICATIONS = [
      ['restaurant', 'Restaurants',      'Outdoor dining areas and covered patios.'],
      ['hotel',      'Gardens & Lanais', 'Open-air garden venues, covered lanais, rooftop bars.'],
      ['warehouse',  'Warehouses',       'Semi-enclosed warehouse zones and loading areas.'],
      ['dumbbell',  'Gymnasiums',       'Indoor sports halls and fitness centres with high occupancy.'],
      ['building',   'Public Places',    'Covered markets, transport terminals, lobby atriums.'],
      ['fork',      'Al Fresco Dining', 'Open-air restaurants, beach clubs, resort terraces.'],
    ];

    const App = () => (
      <Page active="Products">
        {/* HERO */}
        <section style={{position:'relative', overflow:'hidden', background:'#04111F', paddingTop: 164}}>
          <div style={{position:'absolute', inset: 0, background:'radial-gradient(circle at 18% 30%, rgba(24,183,255,0.28), transparent 32%), radial-gradient(circle at 82% 18%, rgba(30,200,130,0.25), transparent 38%), linear-gradient(135deg,#030B14 0%,#071B2F 45%,#0A2342 75%,#061728 100%)'}}/>
          <div style={{position:'absolute', inset:0, opacity:0.14, backgroundImage:'linear-gradient(90deg, rgba(110,216,255,0.18) 1px, transparent 1px), linear-gradient(rgba(110,216,255,0.16) 1px, transparent 1px)', backgroundSize:'86px 86px', maskImage:'radial-gradient(circle at 65% 50%, rgba(0,0,0,1) 30%, transparent 80%)', WebkitMaskImage:'radial-gradient(circle at 65% 50%, rgba(0,0,0,1) 30%, transparent 80%)'}}/>
          <div style={{position:'absolute', inset:0, background:'linear-gradient(to bottom, rgba(0,0,0,0.30), transparent 22%, transparent 82%, #030B14)', pointerEvents:'none'}}/>

          <div style={{position:'relative', zIndex: 5, maxWidth: 1480, margin:'0 auto', padding:'40px 40px 100px', display:'grid', gridTemplateColumns:'1.1fr 0.9fr', gap: 56, alignItems:'center'}}>
            <div className="ko-fade-up">
              {/* Crumbs */}
              <div style={{display:'inline-flex', alignItems:'center', gap: 10, color:'rgba(110,216,255,0.75)', fontFamily:'var(--ko-font-display)', fontSize: 12.5, fontWeight: 600, letterSpacing:'0.04em'}}>
                {[{label:'Home', href:'Klima Optima Homepage.html'},{label:'Products', href:'products.html'},{label:'Air Conditioners', href:'air-conditioners.html'},{label:'Hybrid Aircon'}].map((c, i) => (
                  <React.Fragment key={i}>
                    {i > 0 && <span style={{color:'rgba(110,216,255,0.40)'}}>›</span>}
                    {c.href ? <a href={c.href} style={{color:'rgba(110,216,255,0.75)', textDecoration:'none'}}>{c.label}</a> : <span style={{color:'#fff'}}>{c.label}</span>}
                  </React.Fragment>
                ))}
              </div>

              <div style={{marginTop: 24, display:'flex', alignItems:'center', gap: 14}}>
                <span style={{display:'inline-flex', alignItems:'center', gap: 12, borderRadius: 9999, border:'1px solid rgba(30,200,130,0.28)', background:'rgba(30,200,130,0.08)', backdropFilter:'blur(16px)', padding:'9px 20px', fontFamily:'var(--ko-font-display)', fontSize: 11.5, fontWeight: 800, letterSpacing:'0.22em', textTransform:'uppercase', color:'rgba(30,200,130,0.85)'}}>
                  <span style={{width:6, height:6, borderRadius:9999, background:'rgba(30,200,130,0.8)', boxShadow:'0 0 12px rgba(30,200,130,0.8)', animation:'ko-pulse 2.4s ease-in-out infinite'}}/>
                  Hybrid Technology
                </span>
                <Tag>KCH-9000</Tag>
              </div>

              <h1 style={{margin:'28px 0 0', maxWidth: 720, fontFamily:'var(--ko-font-display)', fontWeight: 900, fontSize:'clamp(2.5rem, 5vw, 4.5rem)', lineHeight: 0.98, letterSpacing:'-0.028em', color:'#fff', textTransform:'uppercase'}}>
                Hybrid <span style={{background:'linear-gradient(90deg,#18B7FF,#9EEBFF)', WebkitBackgroundClip:'text', backgroundClip:'text', color:'transparent'}}>Aircon</span>
              </h1>
              <p style={{margin:'28px 0 0', maxWidth: 640, fontSize: 18, lineHeight: 1.65, color:'rgba(255,255,255,0.74)'}}>
                Patented hybrid cooling system combining evaporative and refrigerant technology. Engineered for outdoor, semi-outdoor, and large ventilated commercial spaces, restaurants, gardens, warehouses, gyms, and public areas.
              </p>
              <div style={{marginTop: 40, display:'flex', flexWrap:'wrap', gap: 14}}>
                <a href="contact.html" className="ko-btn ko-btn-primary" style={{textDecoration:'none'}}>Request Consultation <Icon name="arrow-right" size={18}/></a>
                <a href="resources.html" className="ko-btn ko-btn-secondary" style={{textDecoration:'none'}}>Download Spec Sheet</a>
              </div>

            </div>

            {/* Hero render */}
            <div style={{position:'relative', minHeight: 540, display:'flex', alignItems:'center', justifyContent:'center'}} className="ko-fade-in">
              <div style={{position:'absolute', inset:'10% -10%', borderRadius:'50%', background:'radial-gradient(circle, rgba(24,183,255,0.28), transparent 55%)', filter:'blur(50px)', pointerEvents:'none'}}/>
              <div style={{position:'absolute', inset:'20% 0', borderRadius:'50%', background:'radial-gradient(circle, rgba(30,200,130,0.15), transparent 55%)', filter:'blur(50px)', pointerEvents:'none'}}/>
              <div style={{position:'relative'}} className="ko-hero-float">
                <image-slot
                  id="hybrid-ac-hero-image"
                  placeholder="Drop Hybrid Aircon product photo here"
                  shape="rounded" radius="18"
                  style={{
                    width: '360px',
                    height: '500px',
                    borderRadius: '24px',
                    border: '1px solid rgba(110,216,255,0.30)',
                    background: 'rgba(6,23,40,0.40)',
                    filter: 'drop-shadow(0 30px 50px rgba(24,183,255,0.22)) drop-shadow(0 0 40px rgba(30,200,130,0.12))'
                  }}
                />
              </div>
            </div>
          </div>
        </section>

        {/* KEY FEATURES */}
        <SectionBand shade={1}>
          <Reveal>
            <SectionHead align="center" eyebrow="Key Features" title="Patented Hybrid" titleHighlight="Cooling Technology." sub="A dual-cycle system that outperforms pure evaporative coolers in humid conditions and runs more efficiently than conventional refrigerant-only units."/>
            <div style={{marginTop: 56, display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap: 18}}>
              {FEATURES.map(([ic,t,c]) => <FeatureCard key={t} icon={ic} title={t} copy={c}/>)}
            </div>
          </Reveal>
        </SectionBand>

        {/* APPLICATIONS */}
        <SectionBand shade={2}>
          <Reveal>
            <SectionHead align="center" eyebrow="Applications" title="Where the Hybrid" titleHighlight="Gets Deployed."/>
            <div style={{marginTop: 56, display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap: 18}}>
              {APPLICATIONS.map(([ic,t,c]) => (
                <GlassCard key={t} padding={28}>
                  <div style={{width:52, height:52, borderRadius:16, background:'rgba(24,183,255,0.10)', color:'#6ED8FF', display:'flex', alignItems:'center', justifyContent:'center', border:'1px solid rgba(110,216,255,0.18)'}}>
                    <Icon name={ic} size={24}/>
                  </div>
                  <h4 style={{margin:'22px 0 0', fontFamily:'var(--ko-font-display)', fontWeight: 800, fontSize: 19, color:'#fff', letterSpacing:'-0.01em', lineHeight: 1.25}}>{t}</h4>
                  <p style={{margin:'12px 0 0', fontSize: 14, color:'rgba(255,255,255,0.64)', lineHeight: 1.6}}>{c}</p>
                </GlassCard>
              ))}
            </div>
          </Reveal>
        </SectionBand>

        {/* SPECIFICATIONS */}
        <SectionBand shade={0}>
          <Reveal>
            <SectionHead align="center" eyebrow="Specifications" title="Technical" titleHighlight="Details."/>
            <div style={{marginTop: 56, maxWidth: 760, marginLeft:'auto', marginRight:'auto', borderRadius: 30, border:'1px solid rgba(110,216,255,0.16)', background:'rgba(255,255,255,0.04)', backdropFilter:'blur(20px)', overflow:'hidden', boxShadow:'0 30px 100px rgba(0,0,0,0.4)'}}>
              <table style={{width:'100%', borderCollapse:'collapse', color:'#fff', fontFamily:'var(--ko-font-body)', fontSize: 15}}>
                <thead>
                  <tr style={{background:'rgba(24,183,255,0.06)'}}>
                    <th style={{padding:'20px 32px', textAlign:'left', fontFamily:'var(--ko-font-display)', fontWeight: 900, fontSize: 11.5, letterSpacing:'0.18em', textTransform:'uppercase', color:'#6ED8FF'}}>Specification</th>
                    <th style={{padding:'20px 32px', textAlign:'left', fontFamily:'var(--ko-font-display)', fontWeight: 900, fontSize: 11.5, letterSpacing:'0.18em', textTransform:'uppercase', color:'#6ED8FF'}}>KCH-9000</th>
                  </tr>
                </thead>
                <tbody>
                  {SPECS.map(([l, v], i) => (
                    <tr key={l} style={{borderTop:'1px solid rgba(110,216,255,0.08)'}}>
                      <td style={{padding:'16px 32px', fontFamily:'var(--ko-font-display)', fontWeight: 700, color:'rgba(255,255,255,0.78)'}}>{l}</td>
                      <td style={{padding:'16px 32px', color:'rgba(255,255,255,0.72)', fontFamily:'var(--ko-font-mono)', fontSize: 14, letterSpacing:'0.02em'}}>{v}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </Reveal>
        </SectionBand>

        {/* RELATED */}
        <SectionBand shade={1}>
          <Reveal>
            <SectionHead align="center" eyebrow="Also Explore" title="Other Cooling" titleHighlight="Categories."/>
            <div style={{marginTop: 56, display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap: 18}}>
              <FeatureCard icon="snowflake" title="Commercial Mobile Aircons" copy="Portable AC for offices, restaurants, hotels, and events. DUO AC, Blizzard Box, Triton AC." link={{label:'View range', href:'commercial-aircons.html'}}/>
              <FeatureCard icon="factory" title="Industrial Portable Aircons" copy="Heavy-duty units for factories, warehouses, and large-scale operations. Up to 22,000 BTU." link={{label:'View range', href:'industrial-portable-aircons.html'}}/>
            </div>
          </Reveal>
        </SectionBand>

        <CTABand
          eyebrow="Need Aircons?"
          title="Talk To Us"
          sub="Surface area, heat load, occupancy, operational hours, we'll size and spec the right aircons for your space."
          primary={{label:'Request Consultation', href:'contact.html'}}
          secondary={{label:'Download Catalog', href:'resources.html'}}
        />
      </Page>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>


<script src="security.js"></script>
</body>
</html>
