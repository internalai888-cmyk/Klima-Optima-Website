<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script src="resilience.js"></script>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net https://www.googletagmanager.com https://www.google-analytics.com https://www.google.com https://www.gstatic.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; frame-src https://www.google.com https://www.youtube.com; connect-src 'self' https://unpkg.com https://cdn.jsdelivr.net https://www.google-analytics.com https://formsubmit.co; object-src 'none'; base-uri 'self'; form-action 'self' https://formsubmit.co;">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service and Support, Klima Optima</title>
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="styles.css">
<style>
  .ko-svc-grid {
    margin-top: 56px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 40px 28px;
  }
  .ko-svc-grid > * {
    width: calc((100% - 56px) / 3);
  }
  @media (max-width: 900px) {
    .ko-svc-grid > * { width: calc((100% - 28px) / 2); }
  }
  @media (max-width: 600px) {
    .ko-svc-grid > * { width: 100%; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="image-slot.js"></script>

  <script type="text/babel" src="Icons.jsx"></script>
  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="PageShell.jsx"></script>

  <script type="text/babel">
    const TABS = {
      services: {
        eyebrow: 'Our Services',
        title: 'Delivering',
        highlight: 'End-to-End Capabilities.',
        sub: 'From design and construction through rental, and maintenance, full climate engineering under one roof.',
        cards: [
          {icon:'gauge',   title:'Installation & Commissioning', copy:'Site survey, sizing, load calculations, and supervised on-site commissioning.'},
          {icon:'support', title:'Technical Consultation',       copy:'Sizing reviews, BMS integration design, and operational tuning advisory.'},
          {icon:'wind',    title:'BMS Integration',              copy:'Units planned into your existing BMS, sensors, and alerting before handover.'},
          {icon:'building',title:'Project Deployment',           copy:'Multi-site rollouts coordinated end-to-end, delivery, install, and sign-off.'},
        ],
      },
      support: {
        eyebrow: 'Ongoing Coverage',
        title: 'Support that keeps',
        highlight: 'systems running.',
        sub: 'Scheduled upkeep, rapid response, and parts coverage that protect uptime long after install.',
        cards: [
          {icon:'shield',    title:'Preventive Maintenance', copy:'Scheduled service intervals, parts replacement, and performance verification.'},
          {icon:'snowflake', title:'Emergency Response',     copy:'Priority dispatch for critical-environment downtime, within 24 hours, metro.'},
          {icon:'zap',       title:'Repairs & Spare Parts',  copy:'Diagnostics, component repair, and genuine spare parts with documented availability.'},
          {icon:'handshake', title:'Warranty & Contracts',   copy:'24-month commercial warranty, with extended coverage under annual service contracts.'},
        ],
      },
    };

    const SERVICE_TILES = [
      {id:'svc-eng-design',   label:'Engineering Design &\nTechnical Consultancy',            ph:'Engineer at CAD workstation'},
      {id:'svc-epc',          label:'Engineering, Procurement\n& Construction (EPC)',           ph:'Site team in hi-vis'},
      {id:'svc-retrofit',     label:'Retrofitting &\nCorrective Services',                    ph:'Technician servicing unit'},
      {id:'svc-rental',       label:'Equipment Rental',                                        ph:'Portable cooling at event'},
      {id:'svc-operational',  label:'Long-Term Operational Support\n& Preventive Maintenance',  ph:'Operator on monitoring call'},
    ];

    const ServiceTile = ({id, label, ph}) => {
      const [hov, setHov] = React.useState(false);
      return (
        <div onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)} style={{display:'flex', flexDirection:'column'}}>
          <div style={{
            position:'relative', borderRadius: 26, overflow:'hidden',
            border:'1px solid ' + (hov ? 'rgba(110,216,255,0.30)' : 'rgba(110,216,255,0.12)'),
            boxShadow: hov ? '0 28px 90px rgba(0,0,0,0.42), 0 0 30px rgba(24,183,255,0.10)' : '0 24px 90px rgba(0,0,0,0.36)',
            transform: hov ? 'translateY(-4px)' : 'none',
            transition:'all 240ms cubic-bezier(0.22,1,0.36,1)',
          }}>
            <image-slot id={id} shape="rect" fit="cover" placeholder={ph} style={{display:'block', width:'100%', height:'240px'}}></image-slot>
          </div>
          <div style={{
            marginTop: 18, textAlign:'center', whiteSpace:'pre-line',
            fontFamily:'var(--ko-font-display)', fontWeight: 900, fontSize: 15.5, lineHeight: 1.25,
            letterSpacing:'0.04em', textTransform:'uppercase',
            color: hov ? '#9EEBFF' : '#fff', transition:'color 240ms',
          }}>{label}</div>
        </div>
      );
    };

    const TabButton = ({label, active, onClick}) => (
      <button onClick={onClick} style={{
        padding: '14px 30px', borderRadius: 9999, cursor:'pointer',
        fontFamily:'var(--ko-font-display)', fontWeight: 800, fontSize: 15, letterSpacing:'-0.005em',
        border:'1px solid ' + (active ? 'rgba(110,216,255,0.45)' : 'rgba(110,216,255,0.14)'),
        background: active ? 'linear-gradient(90deg, rgba(14,142,208,0.30), rgba(24,183,255,0.22))' : 'rgba(255,255,255,0.04)',
        color: active ? '#fff' : 'rgba(255,255,255,0.70)',
        boxShadow: active ? '0 0 28px rgba(24,183,255,0.22)' : 'none',
        transition:'all 240ms',
      }}>{label}</button>
    );

    const App = () => {
      const [tab, setTab] = React.useState('services');
      const t = TABS[tab];
      return (
      <Page active="" footerCta={false}>
        <PageHero
          crumbs={[{label:'Home', href:'Klima Optima Homepage.html'},{label:'Service & Support'}]}
          eyebrow="Local Support"
          headline="Service That"
          headlineHighlight="Keeps Going."
          sub="Installation, maintenance, and technical response across every region you operate, engineered to keep your climate steady, not just your warranty active."
          ctas={<>
            <a href="contact.html" className="ko-btn ko-btn-primary" style={{textDecoration:'none'}}>Request Service <Icon name="arrow-right" size={18}/></a>
          </>}
        />

        {/* Tabbed: Services vs Support & Maintenance */}
        <SectionBand shade={1}>
          <div style={{display:'flex', justifyContent:'center', gap: 12, flexWrap:'wrap', marginBottom: 52}}>
            <TabButton label="Services" active={tab==='services'} onClick={() => setTab('services')}/>
            <TabButton label="Support & Maintenance" active={tab==='support'} onClick={() => setTab('support')}/>
          </div>
          <Reveal>
            <SectionHead align="center" eyebrow={t.eyebrow} title={t.title} titleHighlight={t.highlight} sub={t.sub}/>
            {tab==='services' ? (
              <div className="ko-svc-grid">
                {SERVICE_TILES.map(s => <ServiceTile key={s.id} {...s}/>)}
              </div>
            ) : (
              <div style={{marginTop: 56, display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(240px, 1fr))', gap: 18}}>
                {t.cards.map(c => <FeatureCard key={c.title} icon={c.icon} title={c.title} copy={c.copy}/>)}
              </div>
            )}

            <div style={{
              marginTop: 64,
              display:'flex', alignItems:'center', justifyContent:'space-between', flexWrap:'wrap', gap: 32,
              padding: '36px 44px', borderRadius: 30,
              border:'1px solid rgba(110,216,255,0.18)',
              background:'linear-gradient(135deg, rgba(14,78,138,0.40), rgba(255,255,255,0.04))',
              backdropFilter:'blur(20px)', boxShadow:'0 24px 90px rgba(0,0,0,0.36)',
            }}>
              <div style={{flex:'1 1 360px', minWidth: 0}}>
                <h3 style={{margin:0, fontFamily:'var(--ko-font-display)', fontWeight: 900, fontSize:'clamp(1.4rem, 2.4vw, 2rem)', letterSpacing:'-0.02em', lineHeight: 1.1, color:'#fff'}}>Contact us for more details</h3>
                <p style={{margin:'10px 0 0', fontSize: 15, lineHeight: 1.55, color:'rgba(255,255,255,0.66)', maxWidth: 560}}>Talk to a climate-control specialist about your project, survey, sizing, and deployment included.</p>
              </div>
              <a href="contact.html" className="ko-btn ko-btn-primary" style={{textDecoration:'none', flexShrink: 0}}>
                Request Consultation <Icon name="arrow-right" size={18}/>
              </a>
            </div>
          </Reveal>
        </SectionBand>

      </Page>
      );
    };

    const Field = ({label, placeholder, select, textarea, options}) => {
      const [focus, setFocus] = React.useState(false);
      const wrap = {
        display: 'block',
        borderRadius: 14, border:'1px solid ' + (focus ? 'rgba(110,216,255,0.40)' : 'rgba(110,216,255,0.12)'),
        background:'rgba(255,255,255,0.04)', padding: '12px 16px',
        transition:'all 220ms',
        boxShadow: focus ? '0 0 20px rgba(24,183,255,0.15)' : 'none',
      };
      const labelStyle = { display:'block', fontFamily:'var(--ko-font-display)', fontSize: 10.5, fontWeight: 900, letterSpacing:'0.18em', textTransform:'uppercase', color:focus?'#6ED8FF':'rgba(110,216,255,0.55)', transition:'color 220ms' };
      const inputStyle = { width:'100%', background:'transparent', border:'none', outline:'none', color:'#fff', fontFamily:'var(--ko-font-body)', fontSize: 14.5, padding: '4px 0 0', resize: textarea ? 'vertical' : 'none' };
      return (
        <label style={wrap}>
          <span style={labelStyle}>{label}</span>
          {textarea
            ? <textarea rows={4} placeholder={placeholder} onFocus={() => setFocus(true)} onBlur={() => setFocus(false)} style={inputStyle}/>
            : select
              ? <select onFocus={() => setFocus(true)} onBlur={() => setFocus(false)} style={{...inputStyle, appearance:'none', backgroundImage:'none'}}>{options.map(o => <option key={o} style={{background:'#04111F'}}>{o}</option>)}</select>
              : <input placeholder={placeholder} onFocus={() => setFocus(true)} onBlur={() => setFocus(false)} style={inputStyle}/>}
        </label>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>


<script src="security.js"></script>
</body>
</html>
