<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script src="resilience.js"></script>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net https://www.googletagmanager.com https://www.google-analytics.com https://www.google.com https://www.gstatic.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; frame-src https://www.google.com https://www.youtube.com; connect-src 'self' https://unpkg.com https://cdn.jsdelivr.net https://www.google-analytics.com https://formsubmit.co; object-src 'none'; base-uri 'self'; form-action 'self' https://formsubmit.co;">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solutions, Klima Optima</title>
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="image-slot.js"></script>
  <script type="text/babel" src="Icons.jsx"></script>
  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="PageShell.jsx"></script>

  <script type="text/babel">
    const SOLUTIONS = [
      {
        id:'humidity',
        icon:'droplet',
        label:'Humidity Control',
        copy:'Maintain ideal moisture for healthier, protected indoor environments, from warehousing to hospitality.',
        href:'humidity-control.html',
        industries: ['Healthcare','Cold Storage','Warehousing','Manufacturing'],
        spec: '30-70 % RH',
      },
      {
        id:'portable',
        icon:'snowflake',
        label:'Portable Cooling',
        copy:'Mobile, project-ready cooling for spaces fixed HVAC cannot reach, events, fit-outs, backup, hotspots.',
        href:'portable-cooling.html',
        industries: ['Events','Construction','Hospitality','Offices'],
        spec: 'up to 36k BTU',
      },
      {
        id:'precision',
        icon:'gauge',
        label:'Precision Climate Control',
        copy:'Tight temperature and humidity tolerances for critical environments, labs, server rooms, archives, cleanrooms.',
        href:'precision-climate-control.html',
        industries: ['Labs','Server rooms','Archives','Cleanrooms'],
        spec: '±0.5 °C',
      },
    ];

    const SolutionCard = ({s}) => {
      const [hov, setHov] = React.useState(false);
      return (
        <a href={s.href} onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
          style={{
            position:'relative', display:'flex', flexDirection:'column',
            borderRadius: 34, padding: 36, minHeight: 460,
            border:'1px solid ' + (hov ? 'rgba(110,216,255,0.30)' : 'rgba(110,216,255,0.12)'),
            background:'rgba(255,255,255,0.045)', backdropFilter:'blur(20px)',
            boxShadow: hov ? '0 30px 100px rgba(0,0,0,0.45), 0 0 50px rgba(24,183,255,0.10)' : '0 24px 90px rgba(0,0,0,0.36)',
            transform: hov ? 'translateY(-6px)' : 'none',
            transition:'all 260ms cubic-bezier(0.22,1,0.36,1)',
            textDecoration:'none', color:'inherit', overflow:'hidden',
          }}>
          <div style={{position:'absolute', inset: 0, background:'radial-gradient(circle at 70% 12%, rgba(24,183,255,0.20), transparent 38%)', pointerEvents:'none'}}/>
          <div style={{position:'relative', height: 84, width: 84, borderRadius: 24, background: hov ? '#18B7FF' : 'rgba(24,183,255,0.10)', color: hov ? '#04111F' : '#6ED8FF', display:'flex', alignItems:'center', justifyContent:'center', boxShadow: hov ? '0 0 40px rgba(24,183,255,0.45)' : '0 0 30px rgba(24,183,255,0.16)', border:'1px solid rgba(110,216,255,0.18)', transition:'all 240ms'}}>
            <Icon name={s.icon} size={40}/>
          </div>
          <div style={{position:'relative', marginTop: 16, fontFamily:'var(--ko-font-mono)', fontSize: 11, color:'#6ED8FF', letterSpacing:'0.18em', textTransform:'uppercase'}}>{s.spec}</div>
          <div style={{position:'relative', marginTop: 18, display:'flex', alignItems:'center', justifyContent:'center'}}>
            <div style={{position:'absolute', inset:'-20% -10%', background:'radial-gradient(ellipse at 50% 50%, rgba(24,183,255,0.40), rgba(110,216,255,0.18) 45%, transparent 75%)', filter:'blur(40px)', pointerEvents:'none', zIndex: 0}}/>
            <image-slot
              id={`solution-card-${s.id}`}
              placeholder={`Drop ${s.label} image here`}
              shape="rounded" radius="18"
              style={{
                position:'relative',
                width: '100%',
                height: '200px',
                borderRadius: '18px',
                border: '1px solid rgba(110,216,255,0.22)',
                background: 'rgba(6,23,40,0.55)',
                boxShadow: '0 18px 50px rgba(0,0,0,0.5), 0 0 40px rgba(24,183,255,0.18)',
                zIndex: 1
              }}
            />
          </div>
          <h3 style={{position:'relative', marginTop: 18, fontFamily:'var(--ko-font-display)', fontWeight: 900, fontSize: 28, color:'#fff', letterSpacing:'-0.015em'}}>{s.label}</h3>
          <p style={{position:'relative', marginTop: 14, color:'rgba(255,255,255,0.66)', lineHeight: 1.65, fontSize: 15.5, flex: 1}}>{s.copy}</p>
          <div style={{position:'relative', marginTop: 24, paddingTop: 20, borderTop:'1px solid rgba(110,216,255,0.10)'}}>
            <div style={{fontFamily:'var(--ko-font-display)', fontSize: 10.5, fontWeight: 900, letterSpacing:'0.18em', textTransform:'uppercase', color:'rgba(110,216,255,0.55)'}}>Deployed in</div>
            <div style={{marginTop: 10, display:'flex', flexWrap:'wrap', gap: 8}}>
              {s.industries.map(i => <span key={i} style={{padding:'5px 12px', borderRadius: 9999, background:'rgba(255,255,255,0.03)', border:'1px solid rgba(110,216,255,0.10)', fontSize: 12, color:'rgba(255,255,255,0.62)'}}>{i}</span>)}
            </div>
          </div>
          <span style={{position:'relative', marginTop: 22, color: hov ? '#9EEBFF' : '#6ED8FF', fontFamily:'var(--ko-font-display)', fontWeight: 700, fontSize: 13.5, display:'inline-flex', alignItems:'center', gap: hov ? 12 : 8, transition:'all 240ms'}}>
            Explore solution <Icon name="arrow-right" size={15}/>
          </span>
        </a>
      );
    };

    const USE_CASES = [
      ['hospital','Hospital ward humidity hold','22-26 °C, 50-60 % RH. Held across 24h cycles, integrated with the BMS.','Humidity Control'],
      ['event',   'Ballroom event cooling',     'Portable spot-cool deployed for 6h-48h ballroom and convention events.','Portable Cooling'],
      ['cold',    'Cold-storage anteroom',      'Dehumidified buffer zone reducing condensate at thermal interfaces.','Humidity Control'],
      ['factory', 'Process moisture protection','Stable ambient RH for moisture-sensitive manufacturing lines.','Precision'],
      ['warehouse','Warehouse goods protection','RH held below 55% across a 5,000 m² distribution hub.','Humidity Control'],
      ['gauge',   'Archive vault climate',      'Tight ±2% RH envelope for sensitive document storage.','Precision'],
    ];

    const App = () => (
      <Page active="Solutions">
        <PageHero
          crumbs={[{label:'Home', href:'Klima Optima Homepage.html'},{label:'Solutions'}]}
          eyebrow="Climate Solutions"
          headline="Climate Solutions,"
          headlineHighlight="Engineered."
          sub="Three operational outcomes. Dozens of deployment patterns. Each engineered around what your space actually needs, not catalog defaults."
          ctas={<>
            <a href="#solutions" className="ko-btn ko-btn-primary" style={{textDecoration:'none'}}>Explore Solutions <Icon name="arrow-right" size={18}/></a>
            <a href="contact.html" className="ko-btn ko-btn-secondary" style={{textDecoration:'none'}}>Request Consultation</a>
          </>}
        />

        {/* Three solution categories */}
        <SectionBand shade={1} id="solutions">
          <Reveal>
            <SectionHead align="center" eyebrow="Categories" title="Three" titleHighlight="solution families." sub="Choose by what climate variable matters most: moisture, mobility, or precision tolerance."/>
            <div style={{marginTop: 56, display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap: 22}}>
              {SOLUTIONS.map(s => <SolutionCard key={s.id} s={s}/>)}
            </div>
          </Reveal>
        </SectionBand>

        {/* Use case grid */}
        <SectionBand shade={2}>
          <Reveal>
            <SectionHead align="center" eyebrow="Use Cases" title="Real deployments," titleHighlight="real outcomes." sub="A representative sample of recent commercial work, each engineered for the site's specific tolerance."/>
            <div style={{marginTop: 56, display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap: 18}}>
              {USE_CASES.map(([ic,t,c,tag]) => (
                <GlassCard key={t} padding={28}>
                  <div style={{display:'flex', alignItems:'center', justifyContent:'space-between'}}>
                    <div style={{width:48, height:48, borderRadius:14, background:'rgba(24,183,255,0.10)', color:'#6ED8FF', display:'flex', alignItems:'center', justifyContent:'center', border:'1px solid rgba(110,216,255,0.18)'}}>
                      <Icon name={ic} size={22}/>
                    </div>
                    <Tag>{tag}</Tag>
                  </div>
                  <h4 style={{margin:'20px 0 0', fontFamily:'var(--ko-font-display)', fontWeight: 800, fontSize: 19, color:'#fff', letterSpacing:'-0.01em', lineHeight: 1.25}}>{t}</h4>
                  <p style={{margin:'12px 0 0', fontSize: 14, color:'rgba(255,255,255,0.64)', lineHeight: 1.6}}>{c}</p>
                </GlassCard>
              ))}
            </div>
          </Reveal>
        </SectionBand>

        {/* Industry mapping */}
        <SectionBand shade={0}>
          <Reveal>
            <SectionHead align="center" eyebrow="By Industry" title="Find your" titleHighlight="solution by sector."/>
            <div style={{marginTop: 56, borderRadius: 36, border:'1px solid rgba(110,216,255,0.16)', background:'rgba(255,255,255,0.04)', backdropFilter:'blur(20px)', padding: 32, boxShadow:'0 30px 110px rgba(0,0,0,0.4)'}}>
              <div style={{display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap: 14}}>
                {[
                  ['hospital','Healthcare','Humidity + Precision'],
                  ['hotel','Hotels','Portable + Humidity'],
                  ['building','Construction','Portable'],
                  ['warehouse','Warehousing','Humidity'],
                  ['cold','Cold Storage','Humidity + Precision'],
                  ['factory','Manufacturing','All three'],
                  ['retail','Retail','Portable'],
                  ['building','Offices','Portable + Humidity'],
                ].map(([ic, label, sol]) => (
                  <a key={label} href="industries.html" style={{
                    textDecoration:'none', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
                    padding: '28px 18px', borderRadius: 22,
                    border:'1px solid rgba(110,216,255,0.10)', background:'rgba(6,23,40,0.7)',
                    color:'rgba(255,255,255,0.78)', transition:'all 240ms',
                  }}
                  onMouseEnter={e => {
                    e.currentTarget.style.background = 'rgba(24,183,255,0.05)';
                    e.currentTarget.style.borderColor = 'rgba(110,216,255,0.30)';
                    e.currentTarget.style.color = '#9EEBFF';
                  }}
                  onMouseLeave={e => {
                    e.currentTarget.style.background = 'rgba(6,23,40,0.7)';
                    e.currentTarget.style.borderColor = 'rgba(110,216,255,0.10)';
                    e.currentTarget.style.color = 'rgba(255,255,255,0.78)';
                  }}>
                    <Icon name={ic} size={28}/>
                    <div style={{marginTop: 12, fontFamily:'var(--ko-font-display)', fontWeight: 700, fontSize: 14.5}}>{label}</div>
                    <div style={{marginTop: 4, fontSize: 11.5, color:'rgba(110,216,255,0.55)', fontFamily:'var(--ko-font-mono)', letterSpacing:'0.04em'}}>{sol}</div>
                  </a>
                ))}
              </div>
            </div>
          </Reveal>
        </SectionBand>

        <CTABand
          eyebrow="Need a custom solution?"
          title="Engineers ready to design around your tolerance."
          sub="Bring us your site conditions, operational constraints, and target envelope. We'll come back with a sized, deployable solution."
          primary={{label:'Request Consultation', href:'contact.html'}}
          secondary={{label:'Browse Products', href:'products.html'}}
        />
      </Page>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>


<script src="security.js"></script>
</body>
</html>
