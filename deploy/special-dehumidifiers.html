<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script src="resilience.js"></script>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net https://www.googletagmanager.com https://www.google-analytics.com https://www.google.com https://www.gstatic.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; frame-src https://www.google.com https://www.youtube.com; connect-src 'self' https://unpkg.com https://cdn.jsdelivr.net https://www.google-analytics.com https://formsubmit.co; object-src 'none'; base-uri 'self'; form-action 'self' https://formsubmit.co;">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Dehumidifiers, Klima Optima</title>
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="image-slot.js"></script>
  <script type="text/babel" src="Icons.jsx"></script>
  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="PageShell.jsx"></script>

<script type="text/babel">
    const CATEGORIES = [
      {id:'temp-controlling', icon:'wind', label:'Industrial Temp-Controlling Dehumidifiers', tagline:'Special Dehumidifiers',
       copy:'Integrated systems that regulate temperature and humidity simultaneously for processes that demand both held within tight tolerances.',
       href:'industrial-temp-controlling-dehumidifiers.html'},
      {id:'low-temp', icon:'wind', label:'Industrial Low-Temp Dehumidifiers', tagline:'Special Dehumidifiers',
       copy:'Heavy-duty dehumidification for freezers, cold stores, and chilled production where standard refrigerant systems ice over and fail.',
       href:'industrial-low-temp-dehumidifiers.html'},
      {id:'high-temp', icon:'wind', label:'Industrial High-Temp Dehumidifiers', tagline:'Special Dehumidifiers',
       copy:'Specialized dehumidification rated for hot environments and heated process drying, kilns, curing rooms, and heated production lines.',
       href:'industrial-high-temp-dehumidifiers.html'},
      {id:'thermo', icon:'wind', label:'Thermo Drying Dehumidifiers', tagline:'Special Dehumidifiers',
       copy:'Closed-loop heat-and-dehumidify systems that dry materials quickly and consistently while recovering energy instead of venting it.',
       href:'thermo-drying-dehumidifiers.html'},
      {id:'stable', icon:'wind', label:'Stable Humidity System', tagline:'Special Dehumidifiers',
       copy:'Integrated systems that hold humidity rock-steady at a target setpoint for archives, museums, cleanrooms, and laboratories.',
       href:'stable-humidity-system.html'},
    ];

    const CategoryCard = ({c}) => {
      const [hov, setHov] = React.useState(false);
      return (
        <a href={c.href} onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
          style={{position:'relative', display:'flex', flexDirection:'column', borderRadius: 34, padding: 0, minHeight: 480,
            border:'1px solid ' + (hov ? 'rgba(110,216,255,0.34)' : 'rgba(110,216,255,0.12)'),
            background: 'linear-gradient(180deg, rgba(10,35,66,0.55), rgba(6,23,40,0.85))',
            backdropFilter:'blur(20px)',
            boxShadow: hov ? '0 40px 110px rgba(0,0,0,0.55), 0 0 60px rgba(24,183,255,0.10)' : '0 30px 100px rgba(0,0,0,0.45)',
            overflow:'hidden', transition:'all 280ms cubic-bezier(0.22,1,0.36,1)',
            transform: hov ? 'translateY(-8px)' : 'none', textDecoration:'none', color:'inherit'}}>
          <div style={{position:'absolute', top:-40, right:-40, width: 320, height: 320, background:'radial-gradient(circle, rgba(24,183,255,0.22), transparent 60%)', pointerEvents:'none', opacity: hov ? 1 : 0.6, transition:'opacity 280ms'}}/>
          <div style={{position:'absolute', inset:0, opacity:0.06, backgroundImage:'linear-gradient(90deg, rgba(110,216,255,0.7) 1px, transparent 1px), linear-gradient(rgba(110,216,255,0.7) 1px, transparent 1px)', backgroundSize:'32px 32px', pointerEvents:'none'}}/>
          <div style={{position:'relative', padding: '28px 32px 36px', flex: 1, display:'flex', flexDirection:'column'}}>
            <div style={{display:'flex', alignItems:'center', gap: 14}}>
              <div style={{width: 48, height: 48, borderRadius: 14, background: hov ? '#18B7FF' : 'rgba(24,183,255,0.10)', color: hov ? '#04111F' : '#6ED8FF', display:'flex', alignItems:'center', justifyContent:'center', boxShadow: hov ? '0 0 30px rgba(24,183,255,0.45)' : '0 0 20px rgba(24,183,255,0.12)', border:'1px solid rgba(110,216,255,0.18)', transition:'all 240ms'}}>
                <Icon name={c.icon} size={24}/>
              </div>
              <div style={{fontFamily:'var(--ko-font-mono)', fontSize: 11, color:'rgba(110,216,255,0.65)', letterSpacing:'0.08em'}}>{c.tagline}</div>
            </div>
            <div style={{position:'relative', marginTop: 22, display:'flex', alignItems:'center', justifyContent:'center'}}>
              <div style={{position:'absolute', inset:'-20% -10%', background:'radial-gradient(ellipse at 50% 50%, rgba(24,183,255,0.40), rgba(110,216,255,0.18) 45%, transparent 75%)', filter:'blur(40px)', pointerEvents:'none', zIndex: 0}}/>
              <image-slot
                id={`special-card-${c.id}`}
                placeholder={`Drop ${c.label} image here`}
                shape="rounded" radius="18"
                style={{position:'relative', width: '100%', height: '180px', borderRadius: '18px', border: '1px solid rgba(110,216,255,0.22)', background: 'rgba(6,23,40,0.55)', boxShadow: '0 18px 50px rgba(0,0,0,0.5), 0 0 40px rgba(24,183,255,0.18)', zIndex: 1}}
              />
            </div>
            <h3 style={{position:'relative', marginTop: 22, fontFamily:'var(--ko-font-display)', fontWeight: 900, fontSize: 22, color:'#fff', letterSpacing:'-0.015em', lineHeight: 1.15}}>{c.label}</h3>
            <p style={{position:'relative', marginTop: 14, color:'rgba(255,255,255,0.64)', lineHeight: 1.65, fontSize: 14.5, flex: 1}}>{c.copy}</p>
            <span style={{position:'relative', marginTop: 24, color: hov ? '#9EEBFF' : '#6ED8FF', fontFamily:'var(--ko-font-display)', fontWeight: 700, fontSize: 14, display:'inline-flex', alignItems:'center', gap: hov ? 14 : 10, transition:'all 240ms'}}>
              Explore <Icon name="arrow-right" size={15}/>
            </span>
          </div>
        </a>
      );
    };

    const App = () => (
      <Page active="Products">
        <PageHero
          crumbs={[{label:'Home', href:'Klima Optima Homepage.html'},{label:'Products', href:'products.html'},{label:'Dehumidifiers', href:'dehumidifiers.html'},{label:'Special Dehumidifiers'}]}
          eyebrow="Special Dehumidifiers"
          headline="Special"
          headlineHighlight="Dehumidifiers."
          sub="Purpose-engineered climate systems for the most demanding requirements, temperature-controlling, high and low-temp, thermo-drying, and stable humidity solutions."
          ctas={<>
            <a href="#categories" className="ko-btn ko-btn-primary" style={{textDecoration:'none'}} onClick={(e)=>{e.preventDefault(); const el=document.getElementById('categories'); if(el) window.scrollTo({top: el.getBoundingClientRect().top + window.pageYOffset - 80, behavior:'smooth'});}}>Discover <Icon name="arrow-right" size={18}/></a>
            <a href="contact.html" className="ko-btn ko-btn-secondary" style={{textDecoration:'none'}}>Request Consultation</a>
          </>}
        />
        <SectionBand shade={1} id="categories">
          <Reveal>
            <SectionHead align="center" eyebrow="Specialized Systems" title="Product" titleHighlight="Range" sub="Each system is built for a specific set of conditions where standard dehumidification cannot deliver."/>
            <div style={{marginTop: 56, display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap: 22}}>
              {CATEGORIES.map(c => <CategoryCard key={c.id} c={c}/>)}
            </div>
          </Reveal>
        </SectionBand>
        <CTABand
          eyebrow="Need a specialized system?"
          title="Engineered to your exact conditions."
          sub="Share your temperature range, humidity target, and process requirements, our engineers will spec the right system for you."
          primary={{label:'Request Consultation', href:'contact.html'}}
          secondary={{label:'Back to Dehumidifiers', href:'dehumidifiers.html'}}
        />
      </Page>
    );
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>


<script src="security.js"></script>
</body>
</html>
