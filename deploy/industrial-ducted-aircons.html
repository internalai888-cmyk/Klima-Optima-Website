<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script src="resilience.js"></script>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net https://www.googletagmanager.com https://www.google-analytics.com https://www.google.com https://www.gstatic.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; frame-src https://www.google.com https://www.youtube.com; connect-src 'self' https://unpkg.com https://cdn.jsdelivr.net https://www.google-analytics.com https://formsubmit.co; object-src 'none'; base-uri 'self'; form-action 'self' https://formsubmit.co;">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Industrial Integrated DX Air Conditioner, Klima Optima</title>
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="image-slot.js"></script>
  <script type="text/babel" src="Icons.jsx"></script>
  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="PageShell.jsx"></script>

  <script type="text/babel">
    const BENEFITS = [["wind","Targeted Ducted Airflow","Flexible ducting delivers conditioned air precisely where it is needed across large spaces."],["zap","Rapid Deployment","Mobile units roll into position and run, no fixed installation or downtime."],["snowflake","High-Capacity Cooling","From 30,000 up to 200,000 BTU to handle the largest industrial heat loads."],["maximize","Spot & Zone Cooling","Direct cooling to specific zones, equipment, or personnel instead of the whole building."],["shield","Built for Industry","Heavy-duty construction engineered for continuous operation in demanding environments."],["gauge","Flexible Configuration","Single or multi-duct routing adapts to tents, events, process lines, and warehouses."]];
    const APPLICATIONS = [["factory","Manufacturing & Process","Spot and process cooling for production lines and industrial facilities."],["warehouse","Warehouses & Logistics","Temporary and supplemental cooling across large storage volumes."],["party","Events & Temporary","Rapid-deploy cooling for tents, expos, and large event spaces."]];
    const App = () => (
      <Page active="Products">
        <PageHero
          crumbs={[{label:'Home', href:'Klima Optima Homepage.html'},{label:'Products', href:'products.html'},{label:'Industrial And Precision Air Conditioners', href:'industrial-precision-aircons.html'},{label:"Industrial Integrated DX"}]}
          eyebrow="Integrated DX · Industrial"
          headline="Industrial Integrated DX"
          headlineHighlight="Air Conditioner."
          sub="High-capacity mobile ducted air conditioning that delivers conditioned air precisely where it is needed, engineered for industrial spaces, tents, events, and process cooling with rapid deployment."
          ctas={<>
            <a href="#showcase" className="ko-btn ko-btn-primary" style={{textDecoration:'none'}}>View Range <Icon name="arrow-right" size={18}/></a>
            <a href="contact.html" className="ko-btn ko-btn-secondary" style={{textDecoration:'none'}}>Request Consultation</a>
          </>}
        />
        <SectionBand shade={1} id="showcase">
          <Reveal>
            <div style={{borderRadius: 40, overflow:'hidden', border:'1px solid rgba(110,216,255,0.14)', background:'linear-gradient(135deg, rgba(10,35,66,0.50), rgba(6,23,40,0.85))', backdropFilter:'blur(20px)', boxShadow:'0 30px 110px rgba(0,0,0,0.40)'}}>
              <div style={{position:'relative', padding:'56px 48px', display:'flex', alignItems:'center', justifyContent:'center', background:'radial-gradient(circle at 50% 35%, rgba(24,183,255,0.14), transparent 65%)'}}>
                <div style={{position:'absolute', inset:0, opacity:0.04, backgroundImage:'linear-gradient(90deg, rgba(110,216,255,0.7) 1px, transparent 1px), linear-gradient(rgba(110,216,255,0.7) 1px, transparent 1px)', backgroundSize:'32px 32px', pointerEvents:'none'}}/>
                <div style={{position:'absolute', bottom:'8%', width:'70%', height:'30%', background:'radial-gradient(ellipse, rgba(24,183,255,0.30), transparent 70%)', filter:'blur(60px)', pointerEvents:'none'}}/>
                <image-slot id="ducted-ac-family" placeholder="Drop the Industrial Integrated DX range family photo here" shape="rounded" radius="20" style={{position:'relative', width:'100%', maxWidth:'860px', height:'360px', borderRadius:'24px', border:'2px solid rgba(110,216,255,0.20)', background:'rgba(6,23,40,0.60)', boxShadow:'0 24px 70px rgba(0,0,0,0.55), 0 0 50px rgba(24,183,255,0.15)', zIndex:1}}/>
              </div>
              <div style={{padding:'12px 56px 56px', maxWidth: 920, margin:'0 auto', textAlign:'center'}}>
                <div style={{display:'inline-flex', alignItems:'center', gap: 10, padding:'10px 22px', borderRadius: 9999, border:'1px solid rgba(110,216,255,0.30)', background:'rgba(24,183,255,0.10)', marginBottom: 24}}>
                  <Icon name="snowflake" size={16}/>
                  <span style={{fontFamily:'var(--ko-font-display)', fontWeight: 800, fontSize: 15, color:'#9EEBFF', letterSpacing:'0.02em'}}>Capacity range: 30,000-200,000 BTU</span>
                </div>
                <p style={{margin:'0 auto', color:'rgba(255,255,255,0.72)', lineHeight: 1.75, fontSize: 16.5, maxWidth: 760}}>
                  The Industrial Integrated DX Air Conditioner range delivers conditioned air precisely where it's needed through flexible ducting, engineered for industrial spaces, tents, events, and process cooling with rapid deployment. Models span 30,000 to 200,000 BTU to match your heat load and duct layout.
                </p>
                <p style={{margin:'18px auto 0', color:'rgba(255,255,255,0.55)', lineHeight: 1.6, fontSize: 14, maxWidth: 680}}>
                  Configurations are matched to your heat load, airflow, and duct runs. FlexFlow and ducting are not included. Contact our engineering team for model selection, specifications, and sizing.
                </p>
                <div style={{marginTop: 32, display:'flex', gap: 14, justifyContent:'center', flexWrap:'wrap'}}>
                  <a href="contact.html" className="ko-btn ko-btn-primary" style={{textDecoration:'none', fontSize: 13}}>Inquire for Details <Icon name="arrow-right" size={16}/></a>
                </div>
              </div>
            </div>
          </Reveal>
        </SectionBand>
        <SectionBand shade={0}>
          <Reveal>
            <SectionHead align="center" eyebrow="Advantages" title="Why Choose" titleHighlight="Integrated DX?"/>
            <div style={{marginTop: 56, display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap: 18}}>
              {BENEFITS.map(([ic,t,c]) => <FeatureCard key={t} icon={ic} title={t} copy={c}/>)}
            </div>
          </Reveal>
        </SectionBand>
        <SectionBand shade={1}>
          <Reveal>
            <SectionHead align="center" eyebrow="Applications" title="Where It" titleHighlight="Gets Deployed."/>
            <div style={{marginTop: 56, display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap: 18}}>
              {APPLICATIONS.map(([ic,t,c]) => (
                <GlassCard key={t} padding={28}>
                  <div style={{width:52, height:52, borderRadius:16, background:'rgba(24,183,255,0.10)', color:'#6ED8FF', display:'flex', alignItems:'center', justifyContent:'center', border:'1px solid rgba(110,216,255,0.18)'}}><Icon name={ic} size={24}/></div>
                  <h4 style={{margin:'22px 0 0', fontFamily:'var(--ko-font-display)', fontWeight: 800, fontSize: 19, color:'#fff', letterSpacing:'-0.01em', lineHeight: 1.25}}>{t}</h4>
                  <p style={{margin:'12px 0 0', fontSize: 14, color:'rgba(255,255,255,0.64)', lineHeight: 1.6}}>{c}</p>
                </GlassCard>
              ))}
            </div>
          </Reveal>
        </SectionBand>
        <CTABand eyebrow="Need Aircons?" title="Talk To Us" sub="Surface area, heat load, occupancy, operational hours, we'll size and spec the right aircons for your space." primary={{label:'Request Consultation', href:'contact.html'}}/>
      </Page>
    );
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>


<script src="security.js"></script>
</body>
</html>
