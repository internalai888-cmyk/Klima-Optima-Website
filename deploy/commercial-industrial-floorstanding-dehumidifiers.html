<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

  <script src="image-slot.js"></script>
  <script type="text/babel" src="Icons.jsx"></script>
  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="PageShell.jsx"></script>

<script type="text/babel">

const CATEGORIES = [
{ id: 'commercial', icon: 'wind', label: 'Commercial Dehumidifiers', tagline: '90-168L/day capacity',
  copy: 'Business-grade moisture control for warehouses, hotels, retail spaces, and production areas. Powerful, reliable, and engineered for continuous operation.',
  specs: ['90-200+ L/day', '200-500 m²', 'Continuous duty'], href: 'commercial-dehumidifiers.html' },
{ id: 'industrial', icon: 'wind', label: 'Industrial Floorstanding Dehumidifiers', tagline: '200-960L/day capacity',
  copy: 'Heavy-duty dehumidification for manufacturing, data centers, archives, and critical environments. Maximum capacity, precision control, and operational resilience.',
  specs: ['200-500+ L/day', '500-2000+ m²', 'Industrial-grade'], href: 'industrial-dehumidifiers.html' }];

const CategoryCard = ({ c }) => {
  const [hov, setHov] = React.useState(false);
  return (
    <a href={c.href} onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
    style={{ position: 'relative', display: 'flex', flexDirection: 'column', borderRadius: 34, padding: 0, minHeight: 520,
      border: '1px solid ' + (hov ? 'rgba(110,216,255,0.34)' : 'rgba(110,216,255,0.12)'),
      background: 'linear-gradient(180deg, rgba(10,35,66,0.55), rgba(6,23,40,0.85))',
      backdropFilter: 'blur(20px)',
      boxShadow: hov ? '0 40px 110px rgba(0,0,0,0.55), 0 0 60px rgba(24,183,255,0.10)' : '0 30px 100px rgba(0,0,0,0.45)',
      overflow: 'hidden', transition: 'all 280ms cubic-bezier(0.22,1,0.36,1)',
      transform: hov ? 'translateY(-8px)' : 'none', textDecoration: 'none', color: 'inherit' }}>
          <div style={{ position: 'absolute', top: -40, right: -40, width: 320, height: 320, background: 'radial-gradient(circle, rgba(24,183,255,0.22), transparent 60%)', pointerEvents: 'none', opacity: hov ? 1 : 0.6, transition: 'opacity 280ms' }} />
          <div style={{ position: 'absolute', inset: 0, opacity: 0.06, backgroundImage: 'linear-gradient(90deg, rgba(110,216,255,0.7) 1px, transparent 1px), linear-gradient(rgba(110,216,255,0.7) 1px, transparent 1px)', backgroundSize: '32px 32px', pointerEvents: 'none' }} />
          <div style={{ position: 'relative', padding: '28px 32px 36px', flex: 1, display: 'flex', flexDirection: 'column' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
              <div style={{ width: 48, height: 48, borderRadius: 14, background: hov ? '#18B7FF' : 'rgba(24,183,255,0.10)', color: hov ? '#04111F' : '#6ED8FF', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: hov ? '0 0 30px rgba(24,183,255,0.45)' : '0 0 20px rgba(24,183,255,0.12)', border: '1px solid rgba(110,216,255,0.18)', transition: 'all 240ms' }}>
                <Icon name={c.icon} size={24} />
              </div>
              <div style={{ fontFamily: 'var(--ko-font-mono)', fontSize: 11, color: 'rgba(110,216,255,0.65)', letterSpacing: '0.08em' }}>{c.tagline}</div>
            </div>
            <div style={{ position: 'relative', marginTop: 22, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <div style={{ position: 'absolute', inset: '-20% -10%', background: 'radial-gradient(ellipse at 50% 50%, rgba(24,183,255,0.40), rgba(110,216,255,0.18) 45%, transparent 75%)', filter: 'blur(40px)', pointerEvents: 'none', zIndex: 0 }} />
              <image-slot
            id={`cifs-card-${c.id}`}
            placeholder={`Drop ${c.label} image here`}
            shape="rounded" radius="18"
            style={{
              position: 'relative',
              width: '100%',
              height: '200px',
              borderRadius: '18px',
              border: '1px solid rgba(110,216,255,0.22)',
              background: 'rgba(6,23,40,0.55)',
              boxShadow: '0 18px 50px rgba(0,0,0,0.5), 0 0 40px rgba(24,183,255,0.18)',
              zIndex: 1
            }} />
          
            </div>
            <h3 style={{ position: 'relative', marginTop: 22, fontFamily: 'var(--ko-font-display)', fontWeight: 900, fontSize: 26, color: '#fff', letterSpacing: '-0.015em', lineHeight: 1.1 }}>{c.label}</h3>
            <p style={{ position: 'relative', marginTop: 14, color: 'rgba(255,255,255,0.64)', lineHeight: 1.65, fontSize: 14.5, flex: 1 }}>{c.copy}</p>
            <span style={{ position: 'relative', marginTop: 24, color: hov ? '#9EEBFF' : '#6ED8FF', fontFamily: 'var(--ko-font-display)', fontWeight: 700, fontSize: 14, display: 'inline-flex', alignItems: 'center', gap: hov ? 14 : 10, transition: 'all 240ms' }}>
              Explore range <Icon name="arrow-right" size={15} />
            </span>
          </div>
        </a>);

};

const SELECTION = [
['gauge', 'Match Capacity to Load', 'Commercial units cover 90-168 L/day; industrial floorstanding models run 200-960 L/day for larger volumes and heavier moisture loads.'],
['building', 'Match Coverage to Space', 'Commercial suits 200-500 m² interiors. Industrial handles 500-2000+ m² halls, plants, and storage volumes.'],
['factory', 'Match Build to Duty', 'Both ranges run continuously. Industrial models add heavier components and precision control for mission-critical environments.']];

const App = () =>
<Page active="Products">
        <PageHero
    crumbs={[{ label: 'Home', href: 'Klima Optima Homepage.html' }, { label: 'Products', href: 'products.html' }, { label: 'Dehumidifiers', href: 'dehumidifiers.html' }, { label: 'Commercial and Industrial Floorstanding' }]}
    eyebrow="Floorstanding · Commercial & Industrial"
    headline="Commercial and Industrial"
    headlineHighlight="Floorstanding Dehumidifiers."
    sub="Two floorstanding ranges covering 90 to 960 L/day, commercial units for business interiors and industrial models for high-capacity, mission-critical environments."
    ctas={<>
            <a href="#ranges" className="ko-btn ko-btn-primary" style={{ textDecoration: 'none' }}>View Ranges <Icon name="arrow-right" size={18} /></a>
            <a href="contact.html" className="ko-btn ko-btn-secondary" style={{ textDecoration: 'none' }}>Request Consultation</a>
          </>}
    media={
    <div style={{ position: 'relative', width: '100%' }}>
              <div style={{ position: 'absolute', inset: '-12% -6%', background: 'radial-gradient(ellipse at 55% 45%, rgba(24,183,255,0.38), rgba(110,216,255,0.16) 45%, transparent 72%)', filter: 'blur(46px)', pointerEvents: 'none', zIndex: 0 }} />
              <image-slot
        id="cifs-hero-family"
        placeholder="Drop a floorstanding dehumidifier product-family photo here"
        shape="rounded" radius="30" fit="contain"
        style={{
          position: 'relative', zIndex: 1, display: 'block',
          background: 'transparent', width: "100%", height: "clamp(460px, 44vw, 580px)" }} />
            </div>
    } />

        <SectionBand shade={1} id="ranges">
          <Reveal>
            <SectionHead align="center" eyebrow="Product Range" title="Floorstanding Dehumidifier" titleHighlight="Range." sub="Select the range that matches your capacity, coverage, and duty requirements." />
            <div className="ko-cat-grid" style={{ marginTop: 56, display: 'grid', gridTemplateColumns: 'repeat(2,1fr)', gap: 22, maxWidth: 1000, marginLeft: 'auto', marginRight: 'auto' }}>
              {CATEGORIES.map((c) => <CategoryCard key={c.id} c={c} />)}
            </div>
          </Reveal>
        </SectionBand>

        <SectionBand shade={2}>
          <Reveal>
            <SectionHead align="center" eyebrow="How to Choose" title="Selecting the Right" titleHighlight="Range." />
            <div style={{ marginTop: 56, display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 18 }}>
              {SELECTION.map(([ic, t, c]) => <FeatureCard key={t} icon={ic} title={t} copy={c} />)}
            </div>
          </Reveal>
        </SectionBand>

        <CTABand
    eyebrow="Need Sizing Help?"
    title="Talk to Us"
    sub="Tell us about your space, surface area, humidity targets, and operating conditions, and we'll come back with a sized proposal."
    primary={{ label: 'Request Consultation', href: 'contact.html' }}
    secondary={{ label: 'Back to Dehumidifiers', href: 'dehumidifiers.html' }} />

      </Page>;

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>


<script src="security.js"></script>
